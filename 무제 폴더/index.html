<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main class="container">
      <section class="section">
        <div class="left">
          <span class="badge">Point. 01</span>
          <p class="title">
            누구나 손쉽게, 온라인 <br />롤링 페이퍼를 만들 수 있어요
          </p>
          <p class="description">로그인 없이 자유롭게 만들어요.</p>
        </div>
        <div class="right">
          <img src="./assets/group-1.png" alt="group-1" />
        </div>
      </section>
      <section class="section row-reverse">
        <div class="left">
          <span class="badge">Point. 02</span>
          <p class="title">서로에게 이모지로 감정을 <br />표현해보세요</p>
          <p class="description">롤링 페이퍼에 이모지를 추가할 수 있어요.</p>
        </div>
        <div class="right">
          <img src="./assets/group-2.png" alt="group-2" />
        </div>
      </section>
      <div class="button-container">
        <button>구경해보기</button>
      </div>
    </main>
  </body>
</html>
