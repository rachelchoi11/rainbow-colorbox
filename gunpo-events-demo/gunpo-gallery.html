<meta name="viewport" content="width=device-width, initial-scale=1"/>

<style>
  :root{--teal:#0A7373;--teal-d:#0A4747;--accent:#FBBF24;--ink:#0F172A;--slate:#64748B;--line:#E5E7EB}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard Variable',sans-serif;color:var(--ink);background:#fff;word-break:keep-all}
  .gnb{background:#0f1720;color:#fff;display:flex;height:72px}
  .gnb .brand{display:flex;align-items:center;gap:10px;padding:0 28px;font-weight:900;font-size:20px;background:var(--teal)}
  .gnb .brand i{color:var(--accent);font-style:normal}
  .gnb nav{display:flex}
  .gnb nav a{padding:0 24px;color:#cbd5e1;font-weight:700;font-size:16px;line-height:72px;text-decoration:none;cursor:pointer}
  .gnb nav a.on{color:#fff;background:var(--teal)}
  .subtabs{display:flex;margin:26px 40px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
  .subtabs button{padding:13px 32px;border:0;background:#fff;font-size:16px;font-weight:700;color:var(--slate);cursor:pointer;border-right:1px solid var(--line)}
  .subtabs button:last-child{border-right:0}.subtabs button.on{color:var(--teal);font-weight:800}
  .searchbar{margin:18px 40px;background:var(--teal);border-radius:6px;padding:16px 20px;display:flex;align-items:center;gap:14px;color:#fff}
  .searchbar .lbl{font-weight:800;font-size:15px;white-space:nowrap}
  .searchbar input{border:0;border-radius:6px;padding:11px 14px;font-size:14px;font-family:inherit}
  .searchbar input[type=date]{width:160px}.searchbar .q{flex:1;min-width:120px}
  .searchbar button{background:var(--teal-d);color:#fff;border:0;border-radius:6px;padding:12px 26px;font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap}
  .countbar{margin:6px 40px 0;display:flex;align-items:baseline;gap:10px}
  .countbar b{font-size:20px;font-weight:900}.countbar b span{color:var(--teal)}
  .countbar .live{margin-left:auto;font-size:12px;font-weight:800;color:#16A34A}
  .srcrow{display:flex;align-items:center;gap:9px;margin:9px 40px 0;flex-wrap:wrap}
  .srcrow .sp{background:#ECFEFF;border:1px solid #A5F3FC;color:#0A4747;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700}
  .srcrow .sp b{color:#0A7373;margin-left:5px;font-size:14px}
  .srcrow .op{color:#94A3B8;font-weight:900;font-size:15px}
  .srcrow .eq{font-weight:900;color:#0A4747;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:6px 12px;font-size:13px}
  .srcrow .note{color:#94A3B8;font-size:12px;margin-left:auto}
  .hostbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 40px 0}
  .hostbar .h{border:1px solid var(--line);background:#fff;color:#475569;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:700;cursor:pointer}
  .hostbar .h.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .hostbar .h b{font-weight:800;margin-left:5px;opacity:.85}
  .hostbar .flbl{font-size:12px;font-weight:800;color:#94A3B8;align-self:center;margin-right:2px;flex:0 0 56px}
  #agebar .h.on{background:var(--accent2);border-color:var(--accent2)}
  .sectit{margin:26px 40px 12px;font-size:18px;font-weight:900;color:var(--teal-d);display:flex;align-items:center;gap:9px}
  .sectit .badge{font-size:12px;font-weight:800;color:#fff;background:var(--accent);color:#3a2a00;padding:3px 10px;border-radius:999px}
  .sectit .cnt{font-size:14px;color:var(--slate);font-weight:700}

  .card{cursor:pointer;text-decoration:none;color:inherit;display:block}
  .poster{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#1f2937;box-shadow:0 6px 18px rgba(15,23,42,.14)}
  .poster .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .poster .pcat{position:absolute;top:13px;right:13px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--teal-d);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:2}
  .poster .pstatus{position:absolute;top:14px;left:14px;font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;z-index:2}

  .card .cmeta{margin-top:7px;font-size:13px;color:var(--slate);text-align:center;line-height:1.6}
  .card.dim .poster{filter:grayscale(.3) opacity(.85)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}

  tbody td.tname{text-align:left;font-weight:700;color:var(--ink);min-width:230px}
  .tcat{font-size:11px;font-weight:800;color:var(--teal-d);background:#E0F2F1;padding:3px 9px;border-radius:6px}
  .tstatus{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px}
  .tstatus.open{background:#FEF3C7;color:#92400E}.tstatus.closed{background:#F1F5F9;color:#64748B}.tstatus.ing{background:#DCFCE7;color:#15803D}

  .kw{display:flex;flex-wrap:wrap;gap:10px;margin:20px 40px 50px}
  .kw .k{background:#F1F5F9;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700}
  .kw .k b{color:var(--teal);margin-right:6px}.kw .k i{font-style:normal;color:var(--slate);font-size:12px;margin-left:6px}
  .hidden{display:none}
  .foot{margin:0 40px;padding:18px 0 40px;border-top:1px solid var(--line);font-size:12px;color:#94A3B8}

itle":"파도의 아이들","pub":"파주: 돌베개, 2024","desc":"세 명의 10대 주인공 ‘설’, ‘광민’, ‘여름’이 북한의 고향을 떠나 새로운 삶을 찾기까지의 여정을 그렸다. 자기 앞에 주어진 녹록지 않은 현실에 굴하지 않고, 끝까지 자신의 의지대로 앞날을 선택하고자 한 세 청춘의 성장이 생생하게 펼쳐진다. 13년 동안 100여 명에 달하는 실제 탈북 청소년들을 인터뷰한 작가의 성실한 취재를 바탕으로, 이들이 마주해야 했던 고난과 좌절, 이별의 경험과 그럼에도 끝내 포기할 수 없었던 절실함이 담겨 있다."},{"title":"부모의 어휘력","pub":"서울: 카시오페아, 2024","desc":"‘아이는 부모가 쓰는 어휘대로 자라납니다.＇이 책은 일상어휘-감정어휘-생각어휘 3장으로 나누어 부모가 평소에 쓰는 어휘가 아이들에게 어떤 영향을 주는지 예시문을 통해 알려주고 있다. 이렇게 어휘를 다르게 사용하면 아이의 행동이 달라지고 태도가 달라질 수 있구나 를 책을 읽으며 스스로 체득하게 된다. 대화를 하면서 여러 이야기보다도 올바른 어휘를 사용하는 것만으로도  아이의 세계가 확장되고 아이와의 관계도 깊고 단단해질 것이다. 아이에게 말을 하면서 한계에 부딪칠 때가 있는 부모라면 당장 부모의 어휘력을 높이고 바꾸는 공부가 필요한 시점이다."},{"title":"담을 넘은 아이","pub":"서울:비룡소, 2019","desc":"흉년의 조선시대에 가난한 집 맏딸로 태어난 푸실이의 이야기이다. 먹을거리를 찾아 산에 갔다 서책 하나를 발견하고 양반댁 아가씨와 마주치며 까막눈인 푸실이는 글자와 책에 관심을 갖게 되며 글자를 익힌다. 하나뿐인 남동생에게 모든 것을 양보 해야 했고 양반댁  젖어미로 떠난 어머니, 이름도 없이 ‘아기’로만 불리는 여동생!  현실은 신분과 성별이라는 높은 담에 가로 막혀 있다. 그러나 그냥 받아들이는 것이 아니라 문이 막혔으면 담을 넘는 것처럼 푸실이는  자신 앞에 놓인 역경과 차별에 그렇게 성장하며 담을 넘은 아이로 성장한다.  작가의 바람처럼 그 어떤 차별도 부당함도 없이 모두가 행복한 세상에서 살길 바라는 마음으로 이 책을 읽어 보길 추천한다."},{"title":"제철 행복","pub":"서울: 인플루엔셜, 2024","desc":"누구에게나 공평하게 주어지는 사계절의 시간을 누군가는 촘촘히 겪으며 살아가고, 누군가는 바쁜 일정을 살다 문득 고개를 들고 보니 어느덧 무더운 여름도 지나가고 찬바람 부는 날이 왔다는 걸 알게 되기도 합니다. 작가는 사계절 12개월을 24절기로 촘촘하게 나누어 그 절기에 할 수 있는 행복한 일들을 하며 일년을 살아 본 경험을 독자들에게 생동감 있는 문체로 전달합니다. 밤 기온이 내려가 풀잎에 흰 이슬이 맺힌다는 백로를 지나는 이 절기에 누릴 수 있는 행복은 무엇일까요? 지난 두 계절동안 우리가 놓치고 있던 행복은 무엇일까요? 각자 마다 절기마다 누리고 싶은 행복은 다를 것 입니다. 우리에게는 아직 10개의 절기가 남아있습니다. 모두에게 공평하게 주어진 이 절기를 어떤 행복으로 채울 예정인지 고민해 보세요."},{"title":"나가자! 독서 마라톤 대회","pub":"서울:꿈터,2017","desc":"호찬이는 달리기를 할 때마다 늘 마음을 졸입니다. 달리기를 잘 못하기도 하고 자기 때문에 팀이 질까봐 더 조마조마합니다. 반 대항 이어달리기는 그런 호찬이에게 더 힘듭니다. 친구들은 그런 호찬이를 보며 엉금엉금 거북이 같다고 놀립니다. 자신감이 떨어진 호찬이에게 나타난 거북이 코치! 과연 거북이 코치가 제안한 독서 마라톤은 무엇일까? 호찬이가 자신만의 마라톤으로 어떻게 성장할지 함께 봅시다."},{"title":"화이트홀","pub":"서울: 쌤앤파커스, 2024","desc":"이 책은 양자 이론과 중력 이론을 결합한 ‘루프 양자 중력’이라는 개념으로 블랙홀을 새롭게 규명한 우주론의 대가인 저자 카를로 로벨리가 우주론과 물리학의 심오한 개념을 대중에게 쉽게 설명하는 과정에서 도입한 흥미로운 개념인 ‘화이트홀’에 대한 이야기를 풀어낸다.  인상적이게도 저자는 블랙홀이 화이트홀로 넘어가는 과정에 대한 설명을 위한 깔때기 예시, 시간의 흐름에 대한 이해를 돕기 위한 격벽이 설치된 수조의 예시를 그림과 함께 상세히 설명하고 특유의 여러 시적인 표현과 인용, 감성적인 문체를 녹여내어 과학 이론에 접근하기 어려운 독자들에게도 좀 더 쉽고 명쾌하게 다가간다."},{"title":"세금 내는 아이들.2","pub":"서울: 한경키즈, 2024","desc":"무지개 초등학교의 새로운 나라인 ‘사이다 나라’가 개국하고 민정현 선생님은 새로운 경제 활동인 주식회사를 소개한다. 회사 창업을 희망하는 국민은 투자를 받아 주식회사를 설립할 수 있고 투자를 원하는 국민은 주식회사의 주식을 구입해 주주가 될 수 있게 된다. 선행 경제 교육이 중요한 이 시대에, 이 책을 통해 주식시장의 기본원리 뿐 아니라 경제활동을 통한 협력과 소통을 배울 수 있을 것이다. 또한 주체적이고 독립적으로 돈을 벌고 투자 및 사업을 하는 실용적 이야기를 담아내 미래의 경영인과 투자가를 꿈꾸는 아이들에게 흥미진진한 안내서가 되어줄 것이다."},{"title":"인간을 탐구하는 미술관","pub":"파주:브라이트:다산북스,2022","desc":"이탈리아 미술품 복원사인 저자가 안내하는 르네상스 시대 명화 입문서입니다. 평범한 일상 속 소소한 행복 안에서 신의 은총을 발견한 필리포 리피, 아름다움의 이미지에 맞춰진 여성이 아닌 여성의 이미지에서 아름다움을 찾은 산드로 보티첼리처럼 르네상스 시대의 거장들은 종교적 숭고함으로 우리를 압도하는 작품보다는 인생의 희로애락 경험에서 깨달은 인간 내면의 가치를 표현한  인간적 정서가 가득 담겨있는 작품을 많이 남깁니다. 여러분들도 이 책을 통해서 새로운 인간의 가치를 하나 더 발견하는 기쁨을 얻기를 바랍니다."},{"title":"세계 음식 백과사전","pub":"서울: 그린북, 2023","desc":"식재료에 매우 세심하고 까다로운 이탈리아 사람들이 만든 음식, 토착민들이 먹던 음식과 이주민들이 가져온 음식이 결합된 브라질 음식, 산간?평야?해안 등 지역별로 음식문화가 독특한 우리나라 음식 등 세계 5대륙 67개국의 방대한 음식 정보를 정리한 책입니다. 단순한 먹거리를 넘어 기후, 민족의 역사, 종교 등 문화, 역사적인 배경과 인간의 상상력이 결합된 다양한 세계음식문화를 더 깊이 들여다 볼 수 있습니다. 전세계 각지의 흥미로운 식재료와 새로운 미식에 대해 관심이 많은 친구들은 꼭 읽어보기 바랍니다."},{"title":"세계를 움직인 열 가지 프레임","pub":"파주: 북하우스, 2024","desc":"이 책은 현대 문명을 지탱하는 열 가지 핵심 개념의 생성 과정을 탐구하며, 서구 권력이 어떻게 자신들의 틀을 활용해 세계를 문명과 야만으로 나누고, 억압과 착취의 역사를 펼쳤는지 살펴본다. 근대화 과정에서 선진 문명이란 명목으로 수용된 서구 세계의 사상과 가치관을 그대로 내면화하여 우리의 정체성마저 잃어버린 것이 아닌지 질문을 던진다. 저자는 이 책을 통해 독자들의 머릿속에 심어놓은 권력의 프레임을 비판적으로 바라보고, 세계를 보는 나만의 관점을 정립하기를 제안하고 있다."},{"title":"띄어쓰기 경주","pub":"서울: 만만한책방, 2024","desc":"이 책은 우편배달부가 되기 위해 토끼와 거북이가 띄어쓰기 경주를 벌인다는 동화적 구성을 통해 띄어쓰기에 따라 의미와 상황이 달라짐을 직관적으로 보여 준다. 이야기와 그림이 결합된 직관의 방식을 통해 어린이 독자들이 자주 헷갈려하는 띄어쓰기를 스스로 체득할 수 있도록 세심하게 배려하며, 어린이 독자들이 좋아하는 이솝 우화와 전래동화를 교차하여 동화의 순기능을 발휘한다. 토끼와 거북이는 꿈에 그리던 우편배달부가 될 수 있을까? 건강한 경쟁과 협력, 상생의 가치를 느끼고 배우며 뭉클한 감동을 느껴보자"},{"title":"드디어 만나는 심리학 수업","pub":"서울: 현대지성, 2024","desc":"이제는 심리학 공부가 필수인 시대가 되었다. 심리학 지식에 목마른 독자들을 위해 『드디어 만나는 심리학 수업』이 출간되었다. 이 책은 80여 명의 심리학자와 50여 개의 심리학 이론을 깔끔하게 정리해 준다. 독자들은 이제 애매모호하게 알고 있던 심리학 지식들을 확실히 내 것으로 만들 수 있다. 다양한 심리학 지식을 습득하는 과정에서 우리가 일상에서 마주하는 크고 작은 문제들을 하나씩 풀어나갈 수 있을 것이다. 내용의 이해를 돕는 다채로운 시각 자료도 수록되어 있어 누구든지 쉽고 재미있게 심리학을 공부할 수 있다. 심리학을 처음 접하는 사람이든, 알고 있던 지식을 체계적으로 정리하고 싶은 사람이든 이 책 한 권이면 충분하다."},{"title":"최초의 아이","pub":"서울: 비룡소, 2024","desc":"독일 북부에서 발굴된 2,000년 전 시신인 ‘늪지 미라’에서 영감을 받아 작가적 상상력을 더한 작품으로, 늪에서 쓸쓸한 죽음을 맞은 아이에게 생명을 불어넣으며, 아이가 살았을 서기 1세기 철기시대로 독자를 초대한다. 역사와 허구, 소설과 수필을 매혹적으로 결합하는 새로운 시도를 했다. 미라로 발견된 아이의 삶을 탁월한 상상력으로 섬세하게 재창조한 두 가지 이야기 사이사이에 고고학적 발견, 역사 사료, 과학적 증거와 더불어 작가의 사적인 회고가 담긴 에세이를 삽입한 독특한 구성이 주목할 만하다."},{"title":"마음이 부자인 아이는 어떻게 성장하는가","pub":"서울: 북크레용: 책읽어주는남자, 2024","desc":"저자는 ‘행복할 줄 아는 아이로 키우는 정서 육아법’에 대한 이야기를 소아정신과 전문의의 지식과 엄마로서의 경험으로 방향성을 제시한다. 이 책에서 중요하게 다루는 ‘상호주관성’ 이란 부모와 아이가 서로의 감정을 이해하고 공감하는 과정을 통해 형성되며 상호주관성의 경험이 쌓이면 정서교육과 애착형성이 저절로 이뤄지고 아이의 내면이 단단해 질 수 있다고 말하고 있다. 일상의 대화시간과 놀이활동에서 적용할 수 있는 실질적인 솔루션과 워크시트가 포함되어 있어  아이의 양육과 마음 성장에 고민인 부모라면  도움을 받을 수 있을 것이다."},{"title":"내가 모르는 사이에","pub":"파주:웅진주니어,2021","desc":"이 책은 가난한 내별 마을에 살면서도 부끄러워 하지 않고 인기 많은 반장 고효민,  갑자기 어려워진 가정환경으로 가난이 드러나는 걸 두려워하는 임수현, 부유한 집에서 많은 것을 누리지만 1등이 아니면 불안한 강주목이 주인공으로 , 같은 반인 세 친구는 주목이의 생일파티에서 지갑도난 사건이 일어나자 친구들을 범인으로 의심하며  벌어지는 일을 다루고 있다. 내가 모르는 사이에  다른 사람에 대한 편견과 선입견을 가지면 상대방에게 얼마나 큰 폭력이 될  수도 있는지를 세 아이의 섬세한 심리묘사를 통하여 내용의 몰입도를 높여준다. 결국 단면만으로는 사람을 온전히 이해할 수 없고 솔직함과 용기를 갖고 타인과 함께 해야 한다는 것을 다시금 알게 해주는 책이다."},{"title":"작별하지 않는다","pub":"파주:문학동네,2021","desc":"아름답고 비현실적인 흰 눈. 작품을 읽는 내내 흰 눈이 내리는 풍경이 펼쳐진다. 작품 속 경하의 어머니는 눈만 오면 그 겨울 삼만 명의 사람들이 이 섬에서 살해되던 날을 떠올리고, 경하는 눈이 내리면 오빠와 동생을 찾아 죽은 사람들 얼굴에 얇게 덮인 피 어린 살얼음을 닦아내는 열 세살 어머니를 떠올린다. 아름다운 흰 눈이 내리는 풍경은 총에 맞고, 칼에 베여 죽은 사람들의 고통과 대비 되어 붉은 피가 더욱 선명하게 느껴진다. 인간의 생명이 얼마나 나약한 지 실감하는 동시에 폭력을 행하는 인간의 잔인함과 대비된다. 손가락 두 개가 잘린 고통을 느끼며 70여년 전  총과 칼에 맞아 죽은 사람들의 고통을 느끼는 경하가 존재하는 한, 죽어간 사람들과 작별하지 않고 누군가에게 기억되는지도 모른다. 역사적 비극과 슬픔을 아름다운 문체로 표현한 작품이다."},{"title":"라이징 4학년","pub":"서울: 위즈덤하우스, 2024","desc":"4학년으로 날아오를 친구들에게 전하는 맞춤 동화집!  4학년이 된다는 것이 아무렇지 않은 친구들도 있을 테고, 두근거리는 친구들이 있을 텐데요. 여기 다섯 동화를 통해 4학년 친구들의 이야기를 들어보세요.   가방을 찾아준 듬직한 4학년은 누구 일까? 4학년이 되면 제일 먼저 하고 싶었던 것은? 우주 브로콜리가 이어준 친구이야기와 두려움에 맞서는 리안이, 새로운 친구를 사귀는 것에 긴장을 한 여울이까지… 4학년은 새로운 일이 일어날 때!"},{"title":"세상에서 가장 이상한 비밀","pub":"파주: 넥서스BIZ, 2023","desc":"당신의 마음속에 명확한 목표가 있다면, 그리고 이것을 반드시 성취할 수 있다는 마음가짐이 있다면 이뤄낼 수 있다는 비밀, ?자기계발서의 고전이라고 불리우는 이 책은 세상에서 가장 이상한 이 ‘비밀’을 통하여 누구나 그 원리들을 적용하기만 한다면 성공으로 가는 간단한 성공 공식을 만들었다.  이 책은 각 분야에서 성공한 상위 5%의 사람들이 어떻게 빠른 속도로 정상에 오르는지 알려주는 실용적인 지침서이다. 이 비밀스러운 성공 공식을 실천하는 얼 나이팅게일의 30일 테스트에 도전해 보며 성공을 향한 자신만의 길을 계획해보자."},{"title":"갈라파고스","pub":"서울: 찰리북, 2024","desc":"지구상에서 생물 다양성이 가장 풍부하고 자연의 신비를 오래도록 간직한 갈라파고스 제도를 탐험하기 위해 일곱 명의 과학자가 모였다! 이 책은 갈라파고스 섬의 멸종 위기 생물을 연구하는 일곱 명의 ‘술라탐험대’의 흥미진진한 모험기를 담았다. 이 그림책은 다양한 지식과 정보의 전달 뿐만이 아니라 더 나아가 지구의 현재와 미래를 책을 통해 함께 읽고 고민해 본다는 데 의미가 있다.  갈라파고스 세계의 이야기를 펼쳐, 우리가 맞닥뜨린 환경 문제에 대해 어떠한 미래를 그려나가야 하는지 함께 생각해보는 건 어떨까?"},{"title":"칼 라르손, 오늘도 행복을 그리는 이유","pub":"서울:알에이치코리아, 2020","desc":"스웨덴의 국민화가로 불리는 칼 라르손(Carl Larsson, 1853-1919)의 작품과 삶 그리고 그를 통해 행복의 비밀을 찾고자 하는 저자의 여정이 담긴 책입니다. 절망적인 어린시절에도 불구하고 지극히 평범한 가족의 일상 속 찰나의 행복을 소중하고 경이로운 순간으로 묘사한 그의 따뜻한 그림들.  심지어 “네가 태어난 날이 가장 거지 같은 날이야.”라고 막말을 내뱉는 아버지의 초상화에서조차 이해와 용서의 따뜻한 햇살을 가득 담아 숭고한 이미지를 부여하는 칼 라르손.  별일 없이 아무일도 일어나지 않는 소박한 하루하루, 오늘 여러분은 가족들을 어떠한 시선으로 바라보고 있나요?"},{"title":"지구를 위협하는 21세기 몬스터 대백과","pub":"서울:길벗어린이,2020","desc":"성경에 나오는 거대한 바다 괴물 ‘레비아탄(leviatan)’, 유대교에 전해져 오는 진흙 괴물 ‘골렘(golem) 등 전설과 신화 속 상상의 괴물들이 다양한 환경오염과 결합하여 신문과 뉴스 속 현실의 괴물들이 되어 우리가 사는 지구를 위협하는 이야기입니다.          무겁고 복잡한 주제의 이야기이지만 각 몬스터(환경오염)의 특징, 위험도 등의 정보가 담긴 ‘몬스터 카드‘, ‘몬스터 지도＇를 통해 어린이들이 게임을 하듯 흥미롭게 환경문제에 다가가고 함께 고민할 수 있도록 구성되어 있습니다.  지구를 파괴하는 힘과 회복하게 하는 힘, 둘 모두를 가진 인간에 대해 아이와 어른이 모두 생각해 보는 기회가 되기를 바랍니다"},{"title":"영어 공부 말고 영어 독서 합니다","pub":"서울: 지식과감성#, 2024","desc":"이 책은 영어 원서를 읽는 방법을 설명해 주는 학습서가 아니다. 지금은 영어에 익숙하지만, 처음에는 초보였던 저자들의 좌충우돌 도전기를 담은 에세이다. 영어 원서 읽기에 도전하게 된 계기, 영어 독서 과정에서 영어 실력 향상은 물론이고 성장과 치유라는 삶의 변화를 경험한 이야기 등 실패와 고민을 거듭하며 성장한 저자들의 진솔한 고백이 이어진다. 영어 원서를 읽는 방법부터 북클럽 경험담, 아동용 책부터 인문 고전까지 다양한 원서를 난이도별로 분류하여 영어 독서를 준비하는 독자들에게 도움을 준다."},{"title":"(조선 최초의 여성 경영인) 강빈","pub":"부천: 청어람주니어, 2023","desc":"'여성 인물 도서관’ 시리즈 중 하나인 이 책은 병자호란 이후 볼모로 끌려갔지만 무역과 농장 경영으로 위기를 극복했던 여성 인물을 담은 역사 동화이다. 강빈은 조선 16대 왕 인조의 며느리이자 소현세자의 아내로, 조선에 쳐들어왔던 청나라에 복수하기보다 부강한 조선을 만들어 진정한 승리를 얻고자 노력한 인물이다. 위기에 굴하지 않는 용기, 문제의 해결 방법을 찾는 판단력, 남들은 가지 않았던 길을 선택했던 도전 정신과 실천력에서 실리에 밝았던 경영인의 면모를 발견할 수 있으며, 어린이 독자들에게 많은 배울 점을 준다."},{"title":"나만 옳다는 착각","pub":"서울: 선순환, 2023","desc":"인류는 늘 싸웠다. 사상으로, 종교로, 민족으로, 계급으로 싸웠다. 어떤 싸움은 작아서 금세 화해했지만 어떤 싸움은 커서 사람이 죽었다. 큰 싸움은 기록되었다. 인류는 그 교훈을 배우고 익혔다. 그러나 싸움은 멈추지 않았다. 싸움의 원인에는 나만 옳다는 착각이 반드시 있었다. 범죄와 폭력과 반사회적 행동을 주로 연구하는 심리학자인 저자는 인간의 갈등과 분쟁으로 생기는 여러 종류의 파국을 살피고 분류하고 분석한다. 그 원인에는 ‘내 편 편향’ 등 여러 심리적 편향들이 자리 잡고 있다. 그러한 편향들은 인류의 오랜 본능과도 같아서 쉽게 없앨 수 없다. 하지만 인류는 역사에 기록된 크고 작은 파국들을 극복했다. 저자는 여러 사례를 소개하며 파국적 상황들의 원인을 밝히고 해법을 제시한다."},{"title":"손으로 보는 나의 세계","pub":"서울: 작은코도마뱀, 2024","desc":"길에서 낯선 사람에게 눈도 안 보이면서 돌아다니지 말라는 폭언을 들은 뒤, 후타바는 집 밖에 나가는 일이 두려워졌다. 타스쿠는 학교에 오지 않는 후타바가 걱정되지만, 혼자 힘으로는 도저히 친구 집까지 갈 용기가 나지 않았다. 집 안에만 머물던 후타바는 시각 장애인 마라톤 대회를 준비하며 세상의 빛 속으로 조금씩 나올 준비를 한다. 타스쿠도 낯선 사람에 대한 두려움을 떨치고 흰지팡이를 들고 걷는 연습을 해 나간다. 아이들은 힘겹지만 한 걸음씩 세상 속으로 나아간다. 우리가 살아가는 세상은 장애와 비장애 같은 선은 그어져 있지 않다고, 이 세계는 우리 모두 함께 살아가는 세계라고 외치면서 말이다."},{"title":"세상에서 가장 쉬운 본질육아","pub":"서울: 21세기북스, 2022","desc":"문제 있는 아이는 없다. 아이는 다 다르고 특별하며 아이를 잘 키우기 위해서는 아이가 아니라  부모가 생각하는 마음가짐과 가치관이 무엇인지 확실히 알고 아이에게 다가가야 한다는 것이 이 책의 핵심이다. 본질육아에서 강조하는 ‘밥짓기 요법’이란 밥을 지을 때 쌀, 물, 불이 필요한데 쌀=아이, 물=사랑과 보호, 불=가치와 마음 자세라고 할 수 있으며 이를 통해 신뢰감과 책임감, 기여와 배려를 배울 수 있다고 말하고 있다. 아이에게 바라야 하는 건 아무것도 없다. 부모의 역할은 조건 없는 사랑과 삶에 대한 자율성이다. ‘자식은 잘 키우려고 낳는게 아니라 사랑하려고 낳는 것’ 이란 본질적인 내용을  다시 한번 전하고 있다."},{"title":"삶에 시가 없다면 너무 외롭지 않을까요","pub":"서울: 포레스트북스, 2024","desc":"흔들리는 인생을 감싸줄 일흔일곱 번의 명시 수업 시인, 에세이스트, 인문학 저술가, 그리고 출판 편집자인 작가가 시 작품들을 모으고 글을 달아서 책을 냈다. 시는 최소의 언어로 최대의 의미를 지향하기에 내포하는 의미에 대한 해석이 다양할 수 있고, 작품을 읽는 사람마다 느끼는 감흥도 다를 수 밖에 없다. 작가는 ‘시는 현실에서 아무 쓸모도 없다. 다만 시는 그토록 무용하지만 우리를 계속 살아가게 만드는 힘이 있다, 어쩌면 시를 잊고 살았기 때문에 그토록 외로웠던 것일지도 모른다’고 말한다. 삶이 버겁고 힘들고 외롭다고 느껴질 때, 이 책을 읽는다면 ‘괜찮다’는 말보다 더 깊고 진한 위로가 될 수 있을지도 모른다."},{"title":"코스모스 씽킹","pub":"고양: 알토북스, 2024","desc":"이 책은 인기 크리에이터 천문물리학자 BossB가 우주물리학 속에 우리 삶의 다양한 이치들이 어떻게 담겨 있는가를 저자만의 방식으로 쉽게 풀어낸다.  7장으로 구성된 이 책은 우주의 시작과 끝, 공간과 시간, 시공과 중력, 블랙홀의 본질 등 다채로운 주제를 담아내 우주와 인간의 관계를 탐구하고, 우주의 본질을 통해 우리 자신을 인식하고 돌아보게 한다. 이 책을 통해 단순한 과학적 지식뿐 아니라 우주를 깊게 이해하면서 우리의 좁은 시야 속 세계관을 벗어나 우주라는 광활함 속의 자신을 바라보며 이해하는 넓은 시각을 가져보는 건 어떨까?"},{"title":"(필립 퍼키스의)사진강의 노트","pub":"서울:눈빛,2009","desc":"우리를 둘러싼 무수한 빛과 어둠 그리고 그 다양한 대비들, photograph??빛으로 그리다?? (photo- [ fo?to? ] ??빛, 사진, 광전자??의 ,  -graph?[ ?ræ?f,?r??:f ]??쓴〔기록한〕 것, 쓰는 도구??)  사진작가 필립 퍼키스의 사진촬영과 교육, 사진을 통해 바라본 삶에 대한 담론이 담겨져 있는 책입니다.  이 책은 어떤 재료(카메라, 렌즈, 필름)를 사용하여 어떻게 보이도록 찍는지에 대한 사진의 기술적인 측면 (촬영, 편집, 인화) 보다는 사진이 불러오는 자기 안에 내재된 감정,  세상과 자기자신을 바라보는 시선과 같은 예술적이고 철학적인 측면에 더 초점이 맞춰져 있습니다.  일상에서 늘 함께하는 휴대폰에 카메라를 통해 ‘세상을 더 깊게 보는 눈’을 길러 볼 수도 있지 않을까요? 2025년에는 ‘빛’이라는  지우개를 사용해 어둠을 살살살 지우고 좀 더 밝은 사진을 많이 찍고 싶다는 생각이 듭니다."},{"title":"오감여행","pub":"서울: 휴앤스토리, 2024","desc":"이 책은 ‘여행의 맛’을 채우고자 한 대한민국 여행서이다. 기대감, 미감, 정감, 식감, 만족감이라는 여행의 오감을 채워 줄 수 있는 사색과 자료들이 넘쳐난다. 동서남북 유명한 지역 소개 뿐만 아니라 그 속에 알려지지 않은 여행지도 숨어 있다. 이 책 한 권 들고 떠나는 여행에는 보고 느끼고 먹고 생각할 것들이 가득할 것이다. 특히 초보 여행자들에게 ‘여행의 기술’을 터득하는 데 든든한 길잡이 역할을 해 줄 것이다."},{"title":"어쨌든 폼나게","pub":"서울:지학사아르볼:지학사,2019","desc":"이 책은 직업, 일, 노동에 관한 주제를 다룬 책으로 아직 아이들에게 낯선 개념에 대해서 요즘 아이들이 관심있어 하는 서바이벌 오디션, 아이돌 등의 소재를 가지고 눈높이에 맞춰 설명하고 있다. 아이돌이 된 오빠, 노무사 사무소 직원인 언니, 아르바이트 하는 옆집 삼촌을  지켜보는 아리의 시선을 통해 노동의 정의는 물론 비정규직과 정규직, 열정페이, 아르바이트, 청소년 노동 등 어려운 단어들을 쉽게 풀어내고 있다.  아직은 너무나 되고 싶은 것이 많은, 뚜렷한 꿈을 정하지 못한 아이들에게 노동의 가치를 알고 직업에 대한 자부심을 갖는 것이 중요하다는 것을 알려주는, 그래야 더 열심히 재미나게 폼나게 일할 수 있음을 알려주는 책이다."},{"title":"오늘은 퓨전 요리사","pub":"파주: 리틀씨앤톡, 2023","desc":"얄미운 친구와 같은 모둠이 되어 퓨전 요리 대회를 준비해야한다면 어떤 기분일까요?  베트남 엄마를 둔 준아는 조용한 성격의 친구입니다. 친구도 많지 않은데 자기에게 미운 말을 하는 민설이와는 더더욱 친해지고 싶지도 않습니다.   하지만 운명의 장난일까요? 준아와 민설 그리고 우즈베키스탄 다문화 가정의 려희, 민설이 말이라면 꼼짝 못하는 영찬이까지 너무나도 안 어울리는 이 네 명 잘 섞일 수 있을까요?"},{"title":"변호사 어벤저스.2, 동물 보호법, 책임감을 가져라!","pub":"고양: 가나, 2024","desc":"이 책은 어린이 변호사 양성 프로젝트에 선발되어 법무법인 '지음'에서 일하는 어린이 변호사 4명이 다양한 사건을 해결해 나가는 모습을 그리고 있다. 동물을 키우면서 발생할 수 있는 여러 법적 절차에 대한 내용을 다루며, 동물보호법, 인권, 손해배상, 소송절차 등의 법률용어들을 동물보호법이라는 커다란 주제와 관련된 다양한 이야기로 알차게 잘 담아냈다. 일상생활에서 많이 쓰이지 않아 어려운 법률 용어들이 흥미로운 이야기 안에 자연스럽게 녹아 들어 있기 때문에 이 책을 읽는 아이들이 좀 더 쉽고 친근하게 법률 용어들을 익히고 이해할 수 있을 것이다."},{"title":"이상한 몸 박물관","pub":"파주: 동녘주니어, 2023","desc":"지금은 퇴화하여 쓸모 없어진 대표적인 흔적 기관 ??사랑니(wisdom tooth)??의 안내에 따라 아주 아주 작은 생명체인 원핵생물에서부터 수십억년의 세월을 견딘 현재의 사람의 모습에 이르기까지 인간의 진화와 함께 망가지고 쪼그라든 흔적 기관들의 숨겨진 이야기가 펼쳐집니다. ??모든 생물이 세포 하나짜리 최초의 생명체로 거슬러 가는 자기만의 과거가 있어??  인간만이 특별하고 위대하다고 생각하는 ??인간중심적인 사고??에서 벗어나 인간 또한 자연의 일부로서 모든 생명체들과 연결되어 있다는 열린 사고로 우리 몸을 바라보는 건 어떨까요?"},{"title":"이상한 영어 나라에 빠진 아이들","pub":"서울: 한국경제신문, 2023","desc":"캐나다에서 외국인 친구들을 만나 겪는 시행착오와 갈등, 어려움을 극복하면서 서로를 이해하고 받아들이는 과정을 재미있는 동화로 엮어냈다. 언어가 다른 사람들과 친구가 되어가는 과정 속에서 영어 공부 비법과 영어에 대한 인식의 전환을 보여준다. 영어듣기에 익숙해지는 방법, 영어 쓰기에 능숙해지는 방법, 배경지식을 토대로 영어로 길고 풍성하게 대화할 수 있는 방법, 녹음기를 이용해 영어 발음 실력을 키우는 방법, 영어 일기 쓰기를 통해 문법 공부를 하는 방법 등 어린이 독자들이라면 누구나 궁금해할 만한 비법을 담았다."},{"title":"철학의 쓸모","pub":"서울: 피카, 2024","desc":"삶은 이미 그 자체로 고통이다. 그리하여 고통 없는 삶이란 없다. 삶이라는 어려운 숙제를 풀어 나갈 때, 철학이 쓸모가 있을까? 철학은 쓸모가 있다. 철학은 백면서생의 사치도 전유물도 아니다. 또 쓸모없는 것의 쓸모를, 아무런 도움이 되지 않는 행복을 예찬하지 않는다. 오히려 쓸모없다고 여겨지는 것은 어떤 것도 사유하지 않는다. 이 책에서 말하는 철학의 쓸모는 두 가지다. 하나는 여러 질병으로 고통받는 우리에게 진단과 소견을 제공하는 것, 또 다른 하나는 스스로 건강하다고 믿는 우리에게 실제로는 병에 걸린 사실을 깨닫게 하는 것이다. 이것만으로도 우리가 일생에 경험하는 대부분의 고통은 해결이 된다. 여전히 인간다운 삶에 대해 고민하고 있다면, 이 책에서 ‘한 번뿐인 인생, 어떻게 살아야 하는가’에 대한 답을 찾을 수 있을 것이다."},{"title":"라이프 재킷","pub":"파주: 창비, 2024","desc":"여름 방학이 끝나고 등교한 어느 비 오는 아침, 고은은 같은 반 아이들의 빈 자리를 보고 전날 올라왔던 천우의 인스타그램 스토리를 떠올린다. “우리 요트 탈래?” 집에 요트가 있다며 허세를 부렸던 천우지만, 그 메시지가 고은은 새삼 걱정스럽다. 이후 천우를 비롯해 반장 노아, 전학생 태호, 키 크고 조용한 아이 장진 등 여섯 아이들이 요트를 타고 나간 사실이 밝혀지는데……. 아이들은 무사히 집으로 돌아올 수 있을까? 장난스레 올린 SNS 글에서 시작된 여정이 사건에 사건을 거듭하며 걷잡을 수 없이 커져 가는 가운데, 자신의 행동에 끝까지 책임을 지고자 하는 아이들의 고뇌와 진심이 빛난다. 삶에서 한 번쯤 거센 파도를 마주할 이들 곁에 단단히 자리하게 될 소설이다."},{"title":"예민한 부모를 위한 심리 수업","pub":"서울:청림라이프,2022","desc":"예민한 부모는 육아가 더 힘들까? 대부분 예민하거나 민감한 기질은 고쳐야 할 결점으로 생각하곤 했다. 하지만 이 책의 저자는 예민한 부모의 장점은 최대로 키우고 육아를 방해하는 감정을 다루는 연습을 하면 예민한 부모의 특성은 육아에 큰 강점으로 발휘할 수 있다고 한다. 책의 구성은 민감성 자기보고 검사부터,육아스트레스를 다루는 법, 부정적인 감정을 다스리는 방법, 예민한 부모가 겪게 될 대인문제 및 굳건한 부부관계를 위한 조언까지 포괄적으로 다루고 있다. 일상적이고 간단한 방법으로도 육아와 인생에 큰 변화를 줄 수 있다는 것, 알고 보면 훌륭한 부모가 될 자질을 가진 예민한 당신에게 추천한다."},{"title":"리보와 앤","pub":"파주: 문학동네, 2023","desc":"이 책은 도서관에 있는 로봇 리보와 앤 그리고 도현이의 이야기이다. 리보와 앤이 일하는 도서관에 갑자기 비상상황이 발생하자 모든 사람들이 떠나고 문이 폐쇄되어 아무 이유도 모른 채 사람들을 기다리며 보낸다.  리보와 앤이 배터리 방전, 초기화 등 어려움을 겪을 때 소통하며 우정을 보여주는 유일한 사람친구는 도현이다.  인간과 로봇의 소통과 세심한 감정의 변화가 드러나 있는 책이다. 코로나 시대를 겪으면서 느낀 단절과 타인과의 교류에 어려움을 느끼는 우리 아이들에게 그 당시 힘들었던 마음을 위로 받을 수 있고 연결, 소통 ,그리움이 우리 사회에 얼마나 중요한 것인지, ‘연결감은 생존의 옵션이 아니라 필수요소다’라는 책의 말처럼 리보와 앤을 통해 연결을 느껴보자."},{"title":"소설, 한국을 말하다","pub":"서울: 은행나무, 2024","desc":"혼란스러웠던 2024년 한국사회를 지나오며 느낀 것은 무엇이었습니까? 이 책은 21명의 작가들이 생각하는 한국의 현재 모습을 담은 21편의 짧은 소설들로 이루어져 있습니다. 한국사회를 관통하는 주제와 키워드를 주제로 한국사회의 현재 모습을 이야기하기에 더욱 묵직하게 다가옵니다. 소설 속에는 우리 언니, 내 동생, 우리 할머니, 내 친구의 모습이 있습니다. 또한 나와 닮은 소설 속 주인공들을 만날 수 있습니다.  거지방, 고물가, 오픈런, 번아웃, 중독, 새벽배송, 갈수록 심화되는 양극화와 각종 미디어 플랫폼의 가파른 성장과 영상 콘텐츠들, 빠르게 변화하는 트렌드는 생각할 시간을 주지 않고 뒤를 돌아 볼 틈조차 없습니다. 이 책을 통해 한국 사회가 현재 어디에 있으며, 어디를 향해 가고 있는지 생각해 보는 시간을 가져 보면 어떨까요?"},{"title":"거절은 너무 어려워!","pub":"파주: 국민서관, 2023","desc":"’착한’ 감자의 조건이 무엇일까?  여러분 ‘착한아이콤플렉스’라는 걸 들어보았나요? 착하지 않으면 안 된다라고 생각하는 건데요, 여기 착한감자 콤플렉스가 있는 감자가 있다는 제보가 들립니다. 집에서는 말 잘 듣는 첫째! 친구들 사이에서는 부탁을 다 들어주는 친구! 다른 사람에게는 좋아 보이지만 어느 순간 우등감자에게는 어떤 싹이 나기 시작했대요. 소중한 나를 지키는 법, 감자를 통해 알아봅시다!"},{"title":"무지의 즐거움","pub":"파주: 유유, 2024","desc":"제목부터 눈길을 사로잡는 이 책은 무지를 두려워하지 말고 지식을 탐구하는 즐거움을 찾으며, 배움이 단지 지식을 축적하는 것이 아니라 세상을 새롭게 발견하고 이해하는 과정에서 흥미와 기쁨을 느끼는 것이라고 말한다. 새로운 무지와 배움을 찾아 자신만의 방식으로 끊임없이 변화하며 성장할 수 있는 무지의 즐거움을 알려준다.  무지의 상태를 긍정적으로 바라보며 다양한 영역에 호기심을 가지고 어른들도 마치 아이처럼 순수하게 지식을 즐길 수 있길 바란다면, 이 책을 펼쳐야 할 충분한 이유가 될 것이다."},{"title":"세상을 움직이는 철","pub":"부천: 모알보알, 2024","desc":"이 책은 화학 원소 중 하나이자 인류의 문명과 산업을 일으킨 중요한 물질인 ‘철’을 어린이들이 이해하기 쉽도록 소개하고 있다. 우주에서 철이 만들어진 과정, 철의 화학적 성질 및 철의 여러가지 다양한 쓰임을 재미있는 그림과 함께 담아냈다. 유익한 내용뿐만 아니라 철이 녹스는 원리를 표현하거나 철이 자석이 되어 다시 철을 끌어당기는 성질에 대한 그림은 아이들의 직관적 이해를 돕고 시각적 이미지를 통해 재미와 흥미를 끌어내기에 충분해보인다. 과학의 창으로 세상을 배우는 지식 그림책의 세계를 함께 경험해보자"},{"title":"때로는 개가 사람보다 낫다","pub":"파주: 돌베개, 2024","desc":"겉은 번지르르하지만 속은 시기하고 미워하여 남의 시비를 정탐하면서 독하고 사나운 마음을 숨긴 사람이 빤질거리며 얌전하게 선웃음을 지으며 오거든 너는 짖어야 옳다. 이규보, 「명반오문」, 『동문선』 권56 - 개를 빗대어 자신에 대한 다짐의 글을 남긴 이규보李奎報(1168 ~ 1241), 마음에 들지 않는 개로부터 성찰의 공부를 한 박종경朴宗慶(1765~1817), 개의 입을 빌려 속마음을 토로한 허균許筠(1569 ~ 1618)등 옛 문인들이 남긴 개에 관한 다양한 글과 함께 각 편마다 저자의 자세한 해설이 담겨 있는 인문 교양서입니다. 여덟개의 젖꼭지로 어미 없는 다른 새끼들까지 거두어 열마리의 새끼를 키운 개, 범과 싸워 주인을 구한 개 등 사람이 쉽게 할 수 없는 행동을 한 다양한 개를 바라보며 느낀 선비들의 고민과 깨달음이 담겨있습니다. 인간보다 못하다고 여긴 개의 신비로운 행동을 통하여 사람다움이란 무엇인지 다시 한번 생각해보는 기회가 되기를 바랍니다."},{"title":"명화로 만나는 사계절","pub":"파주:주니어김영사,2021","desc":"르네상스 시대의 작품에서부터 현대미술에 이르기까지 ??계절??을 주제로 골라진 명화작품들을 어린이들이 이해하기 쉽도록 친절하게 설명해주는 교양 그림책입니다. ??에곤 쉴레(Egon Schiele, 1890 ~1918)의 그림 속 우수에 찬 눈을 닮은 해바라기의 꽃술은 무슨 질문을 하고 있는 걸까???, ??모네(Oscar-Claude Monet, 1840 ~ 1926)의 그림 속 소복이 쌓인 눈 위의 발자국은 누구의 발자국일까??? 저자의 참신한 상상력이 담긴 작품 감상과 함께 작가의 화풍, 그림이 그려진 시대와 지역 등의 배경 설명이 알차게 담겨 있습니다. 이제 곧 다가올 봄, 예술작품보다 아름다운 계절의 변화를 놓치지 마시고 꼭 만끽하시기를 바랍니다."},{"title":"우리말 어감 사전","pub":"서울:유유,2021","desc":"저자는 30년 넘게 국어사전을 만들었다. 이 책은 “사전은 언어 현실을 생생하게 비추는 거울”이어야 하기에 규범서가 되어서는 안 된다고 강조한 저자의 신념이 드러나 있다. 웹 검색이 사전을 대체하며 오래전 이미 대부분의 사전이 개정 작업을 중단할 수밖에 없게 되었다. 사전을 꾸준히 사서 볼 만한 책으로 꾸리려면 ‘검색의 도구’보다는 ‘읽을 거리’로서의 '관점이 있는 사전'이 필요한데, 이 책은 바로 이런 상황에서 명쾌한 답을 주는 지침서이다. 독자로 하여금 ‘찾아보는 사전’을 넘어 ‘읽는 사전’의 가능성을 발견하게 해준다."},{"title":"(흔한남매)별난 세계 여행.3, 세계 축제","pub":"서울: 미래엔 아이세움, 2024","desc":"가깝고 먼 이웃 나라의 역사와 문화, 예술과 지리 등 세계 각국의 인문학을 통찰하는 능력은 세계로 발돋움하는 어린이들에게 필수 요소가 되었다. 이 책은 방대하고 복잡한 인문학을 어린이 독자들의 눈높이에 맞추어 쉽고 재미있게 풀어낸다. 각 여행지에 관한 기본적인 설명이 적재적소로 담겨 있어 독자들은 마치 여행하듯 해당 나라의 역사와 전통, 음식, 인물 등 중요한 핵심정보를 알맞게 파악할 수 있다. 어린이 독자들의 글로벌 감수성도 함께 피어날 것이다."},{"title":"프랭클린 익스프레스","pub":"서울: 어크로스, 2024","desc":"인생은 길고 지루한 싸움이다. 중년의 불안과 걱정에 시달리던 작가는자신의 삶을 돌아보며 의문을 품게 된다. 그때 벤저민 프랭클린이라는 인물이 영감처럼 그의 삶에 다가온다. 100달러 지폐의 얼굴로 유명한, 시간 관리와 자기 계발의 아이콘으로 알려진 ‘갓생’ 프랭클린의 삶에도 과연 불만, 시련, 걱정, 의문이 있었을까? 만약 있었다면, 프랭클린은 어떻게 인생의 난제들을 풀고 유용한 삶을 살아갈 수 있었을까 알고  싶어졌다. 《프랭클린 익스프레스》는 에릭 와이너가 필라델피아부터  파리까지 벤저민 프랭클린의 길고 쓸모 있는 삶의 비밀을 찾아 떠난 여행기이자 나이 듦과 인생에 대한 새로운 관점을 탐구하는 여정을  담은 책이다."},{"title":"천 년 집사 백 년 고양이","pub":"서울: 래빗홀: 인플루엔셜, 2024","desc":"세계에 천 년에 한 번 나온다는 ‘천 년 집사’를 찾아가는 과정을 그렸다.죽어 가는 새끼 고양이를 살리려 인공호흡을 하다 ‘고양이 말’을 이해하게 된 형사 고덕, 불법 동물 복제 연구소에서 태어난 백호와의 마지막 교감을 통해 특별한 능력을 얻은 소년 테오, 고양이를 해치며 능력을 얻은 뒤 강력한 힘을 갖기 위해 길 위의 생명을 위협하는 연쇄 킬러, 이 세 사람의 이야기는 천 년 집사의 자격을 둘러싸고 펼쳐진다. 소설은 판타지, 미스터리, 스릴러 장르를 넘나들며 긴장감과 몰입도를 극대화한다. 동물 학대와 유기 문제, 생명 경시 풍조 등 현대 사회에 꼭 필요한 주제를 다루며 억압받는 생명과 동물의 권리에 대한 문학적 상상력과 완성도 높은 서사를 선보인다."},{"title":"아이의 마음을 이해하고 싶은 당신에게","pub":"서울: 알레: 학산문화사, 2024","desc":"“미워!” “저리가!” 등 때때로 아이들은 이해할 수 없는 말이나 행동을 보이곤 한다. 아이들의 이러한 말과 행동은 '유대감과 안정감이 충족되지 않아 생기는 불안에서 비롯된 것이며  감춰진 아이의 감정을 이해하고 나면 아이의 행동은 자연스럽게 바뀐다’라고 저자는 말한다. 이 책을 읽고 나면 \"미워”는  “필요해”로, “저리가”는 “곁에 있어줘”로 받아들일 수 있는  여유가 생길 것이다. 이 책의 저자는 영국 교육부 아동 행동 자문위원이자 교육의 공을 인정받아 대영제국 훈장을 받은 전문가로 현장검증을  통해 만든 핵심전략 양육법과 아이의 정서적 안정감을 높이는 지원도구와 자료를 이 책에 담았다."},{"title":"개 재판","pub":"파주:웅진주니어,2018","desc":"이 책은 시울이가 안락사 당할 위기에 빠진 흰돌이의 무죄를 입증하는 과정을 그린 재판 동화이다. 가깝게 지내온 수지네 집과 시울이네 집. 그러나 수지네 집 개 흰돌이가 시울이 할머니를 무는 사건이 발생하며 두 집 사이에 갈등이 생긴다. 대부분의 마을 사람들은 책임이 흰돌이에게 있다고 여기고 안락사 시키는 것을 당연하게 생각한다. 하지만 시울이가 개로 변해  수사하는  흥미로운 체험을 하면서 동물 안락사 문제를 동물의 입장이 아닌 너무 인간 중심적인 사고로 생각하지 않나 느끼게 된다. 개의 변호사가 되어서 변론을 하는 시울이를 통해 요즘 애완동물을 많이 키우면서 벌어지는 이웃 간의 갈등이나 문제에 대해서 다시 한번 생각해 볼 수 있을 것이다."},{"title":"정욕","pub":"서울: 리드비, 2024","desc":"이 세상을 살아가는데 필요한 것이 무엇이라고 생각하시나요? 누구와도 연결될 수 없는, 또 누구와도 연결되길 욕망하는 아무 관련 없는 세 사람이 한 사람의 죽음으로 연결되기 시작한다. 그리고 그들의 연결은 세상의 상식으로는 도저히 받아들 일 수 없는 사건으로 이어지는데……. 올바른 욕망은 무엇인지, 무엇을 예상하든 그 예상을 시원하게 빗겨가는 이야기를 담고 있습니다. 혼란에 빠져들 준비가 되셨다면 책장을 넘겨보세요."},{"title":"궤도의 다시 만난 과학","pub":"서울: 페이지2, 2024","desc":"과학은 우리에게 분명 호기심을 불러일으키는 영역이지만, 학교 공부 혹은 필요에 의해 암기해야하는 시험용 지식이라는 틀에 가두어 본연의 즐거움을 제대로 누리지 못했던 기억이 누구에게나 있을 것이다.  이에 유튜브와 예능 프로그램에서 과학의 대중화에 힘쓰고 있는 책의 저자인 궤도는 이 책을 통해 잃어버린 과학의 즐거움을 되찾아주고자 한다.  저자는 이러한 교과서 속 지식들을 일상생활과 연결 지어 친절하고 유쾌하게 설명하면서 우리 주변의 평범한 현상들을 과학적인 시각으로 이야기처럼 풀어낸다. 독서를 통해 깊이 있는 과학 이론을 접하고 싶으면서 흥미와 재미도 함께 놓치고 싶지 않은 분들에게 이 책을 추천한다."},{"title":"멍텅구리","pub":"서울: 더숲, 2024","desc":"이 책은 우리나라 최초의 신문 연재 네 컷 만화로서, KAIST 디지털인문학 연구진이 딥러닝 기술과 철저한 고증으로 복원한 결과물이다. 《멍텅구리》는 1920~1930년대 한국 사회의 식민지 현실을 이념이나 선입견 없는 날것 그대로 담아냈다. 지금은 잘 쓰지 않는 옛 어휘와 당시의 유행어들이 포함되어 있어 100년 전 식민지 시대 조선인의 삶과 문화 또한 그대로 느낄 수 있다. 이 책은 단순한 만화 작품을 넘어, 그 시대 사람들의 희로애락과 사회적 맥락을 포착한 문화사적·역사적 기록으로서 가치를 담고 있다."},{"title":"Surrender","pub":"파주: 생각의힘, 2024","desc":"위대한 밴드 U2의 리더 보노의 자서전입니다.＂남편분이 흉부에  엄청난 무기를 보유하고 계셨더라고요“ 심장 수술을 받기 위해 누워있는 병원 응급실 수술대 위에서 부터 무기와 같은 심장으로 고군분투하며 살아온 날들 그리고 어머니의 자궁 속에서 만들어진 작은 심장이 세상 밖으로 나와 힘차게 뛰기 시작한 그 순간까지 거슬러 올라 이야기는 끝을 맺습니다. 각 장의 제목으로 사용된 40곡의 대표곡들은 그가 인생을 살면서 찾아낸 핵심멜로디들입니다. 예술가, 행동가, (멍청이), 현실주의자 뒤에 좀 더 나은 세상과 아름다운 음악을 위해 자신의 심장을 기꺼이 바친 겸허한 구도자의 모습 또한 발견하게 되실 겁니다."},{"title":"아키시.1,고양이들의 공격","pub":"서울:샘터,2019","desc":"장난꾸러기 아프리카 소녀 아키시가 왔다!  아키시와 함께라면 웃음이 끊이지 않는다는데? 촘촘하게  땋은 머리에 까만 피부, 맨발로 신나게 동네를 누비는 아프리카 소녀 아키시. 이 장난꾸러기가 나타나는 곳은 늘 떠들썩하다. 심부름을 가다가 난데없이 고양이들과 추격전을 벌이는가 하면, 반려동물 원숭이 ‘부부’를 구출하기 위해 온 동네를 뒤지고, 슈퍼 영웅 흉내 내는 친구를 말리기 위해 고군분투한다.  아키시가 주는 웃음에 빠져 볼 준비하고 책을 펼쳐봐요."},{"title":"세상을 둘로 나눈 벽이 있대!","pub":"고양: 영수책방, 2024","desc":"이 세상을 둘로 나누고 있는 벽이 있다.  많이 가진 사람과 그렇지 못한 사람, 무엇이든 편리하고 풍족하게 누리는 사람과 부족함과 결핍의 곤고함에 시달려야 하는 사람 등, 세상과 사람을 둘로 나누는 '구분의 벽'이다. 이 책은 빈부 격차를 하나의 벽으로 가정해 어린이도 알아야 할 세상의 다양한 이야기들을 잘 담아냈다.  사회의 다양한 빈부격차를 보여주는 그림과 사진이 적재적소에 있어 어린이들이 책의 내용을 이해하는데 도움을 준다. 그저 너와 나의 ‘다름’이, ‘가짐’과 ‘없음’으로 구분되어버리고, 그 명확한 구분선으로 만들어진 세상의 기준에 따라 살아가는 것이 안타까운 일임을, 이 책을 읽는 아이들이 함께 읽고 느끼는 소중한 계기가 되길 바란다."},{"title":"(EBS 초등) 뉴스 어휘 맛집","pub":"고양: EBS Books, 2022","desc":"이 책은 어린이 독자들이 뉴스에서 자주 접하는 어휘를 쉽고 재미있게 이해할 수 있도록 구성한 책이다. 정치와 경제, 사회와 관련된 주요 어휘와 연예 및 스포츠, 날씨에 나오는 어휘 뿐만 아니라 요즘 주목받고 있는 IT 기술 분야의 어휘까지 방대하게 담아냈다. 유쾌한 만화를 읽고 어휘의 뜻과 활용 문장들을 배우다 보면, 어느 순간 뉴스를 자연스럽게 이해할 수 있게 된다. 지식과 시사 상식 또한 알차게 쌓을 수 있다. 평소 뉴스가 어렵고 따분하다고 생각한 어린이 독자들에게 폭넓은 세상의 즐거움을 알게 해 줄 것이다."},{"title":"발명가가 되는 법","pub":"서울: 책과함께어린이, 2021","desc":"인간의 무한한 상상력을 씨앗으로 우리의 삶을 더 나아지게 하고 확장시켜 준 발명품들과 그 아이디어를 꽃피우게 한 발명가들을 만나보는 책입니다. 인간을 더 빠르고, 멀리 이동할 수 있게 해 준 교통수단의 발명부터 문자, 새로운 치료제, 영화 등 우리들의 삶을 이롭고 재미있게 만든 발명의 역사를 만나 볼 수 있습니다. 자유롭고 창의적인 아이디어로 만든 발명품이 인간의 삶을 보다 풍요롭고 안전하게 할 수도 있지만 꼭 우리의 바람대로 행복한 미래만을 보장하는 것은 아닐 수도 있습니다. 너무 자만하지 말고 늘 조심해야 한다는 이카루스Icarus 이야기에도 귀를 기울이며 같이 책을 읽어 볼까요?"},{"title":"가장 젊은 날의 철학","pub":"서울: 북스톤, 2024","desc":"다양성을 존중하는 사회로 나아가고 있다고는 하지만, 한국 사회에서는 여전히 ‘남들처럼은 해야 한다'는 암묵적 기대와 부담을 느낀다.  좋은 대학 진학, 대기업, 높은 연봉 등 많은 사람들이 좋다고 하는 것을  좇다 보면 자연스레 ‘내 삶의 의미는 무엇일까?’ 하는 고민이 생긴다. 하지만 우리는 이런 이야기를 누군가와 나눠본 적이 없기에 ‘나만 지금 이런 고민을 하는 걸까?’ 하는 불안에 시달린다.  우리의 삶과 가깝게 닿아있는 이런 질문들을 실존주의를 통해 생각해보는 이유는 무엇일까? 저자는 철학적 이론보다 현실 문제에 집중하여, 살면서 반드시 생각해봐야 할 24가지 질문에 실존주의를 통해 답했다. 우리가 정해진 길을 걸어야 한다고 요구받을 때, 각자 다름을 응원하고 함께 고민하는 이 책이 나만의 답을 찾는 데 도움이 되길 바란다."},{"title":"울지 않는 달","pub":"파주: 창비, 2025","desc":"어느 날 하늘에서 땅으로 뚝 떨어진 달의 이야기를 담고 있다.  잔혹하지만 아름다운 대지 위에서 달이 겪어 내는 삶을 한 편의 시처럼 순정하고 따스하게 들려준다. 땅으로 내려와 전쟁에서 부모를 잃은  어린아이를 거두고, 외로운 늑대 카나와 함께 그 아이를 먹이고 키우는 동안 달은 어떻게 달라지고 무엇을 깨달을까? 우리가 어디에서 왔고 무엇을 위해 살아가는지와 끝내 연결되어 있을 그 답을 작가는 귀중한 보물처럼 겹겹의 이야기 속에 포개어 건넨다. 자신의 그림책을 읽고 자란 청소년들과 어른들을 위해 다정한 손길로 어루만지듯 써 내려간 이 이야기가, 오래전 달이 그랬듯 이 순간에도 길을 잃고 헤매고 있을 이들에게 벅찬 감동과 위로가 되어 줄 것이다."},{"title":"아이의 뇌","pub":"서울: 포레스트북스,  2024","desc":"인간의 뇌가 가장 말랑말랑한 시기라는 유아의 뇌를  잘 발달시키는 방법은 무엇일까?  진료대기만 3년, 국내 발달뇌과학의 최고 권위자 서울대  소아청소년 정신과 김붕년 교수가 그 해답을 제시한다.   이 책은 '뇌 발달의 결정적 시기에 맞추어 사고력, 공감력,  실행력을 고루 성장시킬 수 있는 실질적이고 구체적인 양육 지침이 담겨 있다.  아이의 평생 행복을 결정짓는 양육 원칙을 얻고 싶은 독자라면 이 책을 펼쳐보기를 권한다."},{"title":"선아의 기분은 록쇽쇽","pub":"서울: 비룡소, 2024","desc":"어른들에게 「사랑인줄 알았더니 부정맥」이 있다면,   아이들에겐 「선아의 기분 록쇽쇽」이 있다!   돼지를 죽인 어른들이 돼지에게 비는 모습이 이상한 아이,  아빠가 좋은지 엄마가 좋은지 물어보는 부모님들에 의해  괴로운 아이까지.. \"어린이의 천진하고도 엉뚱한 시선으로  바라본 세상은 때론 말이 안 되고 이상해 보이는 것투성이다.  이런 마음을 아이들 눈높이의 시로 유쾌 통쾌하게 풀어내,  어른 아이 할 것 없이 독자에게 속 시원한 카타르시스를  안겨 준다.\"고 이 책은 소개한다. 천진한 아이들의 동심과 과감하고 창의적인 동시로 기분좋은  반전을 느껴보고 싶은 독자라면 이 책을 추천한다."},{"title":"레슨 인 케미스트리.1","pub":"파주: 다산책방, 2023","desc":"“여성 과학자들을 몇 명이나 알고 있어요? 퀴리 부인 빼고요“  1950년대 미국에서 여성 화학자로 살아간다는 것에 대하여.  연구소에서 언제나 전문가가 아닌 실험 보조 인력으로 오해  받고 비혼모라는 이유로 쫓겨난 엘리자베스 조트. 그는 부엌을 실험실 삼아 연구를 계속하며 요리 프로그램에 출연해 유명인이 된다. 사실을 기반으로 세상과 화학에 대해 이야기하는  엘리자베스의 행보는 우리에게 많은 영감을 줄 것입니다.  소설을 읽고 드라마도 곁들여 보세요!"},{"title":"예뻐지는 약과 보건 선생님","pub":"춘천: 봄개울, 2024","desc":"금수초등학교 개교 이래 첫 남자 보건 선생님인 조웅희 선생님과 닮은 꼴 아이가 나타났다! 이름은 조영지. 영지는 학생회장 선거에 나가려고 하는데 조웅희 선생님의 이름 성뿐만 아니라 외모도 닮아 고민이 많습니다.  보다 못한 선생님이 영지에게 알약이 든 봉지를 주는데…….  ‘예뻐지는 약’이라 하며 약을 받은 영지. 덕분에 자신감이 쭈욱 올라가는데 과연 이건 예뻐지는 약이 맞을까요?  외모에 관심이 많은 친구들 영지의 변화를 같이 느껴봐요."},{"title":"AI 시대 생존 전략","pub":"서울: 더페이지, 2025","desc":"이 책은 AI 시대를 살아가는 우리에게 시대의 흐름을 주도하는 전문가로 성장하기 위한 종합적인 전략을 제시한다. AI 혁명 시대에 생존과 성공을 위한 핵심적인 전략을 '직장과 업무, 학습과 사고, 비즈니스와 경영, 현재와 미래' 등의 4가지 주제로 나누어 상세히 서술한다. 향후 AI의 등장에도 변하지 않을 가치들에 대해 더욱 집중하여 그것을 어떻게 발전시켜 나아가야 하는지와 관련된 AI의 미래학적 본질에 대한 이야기를 담아내며, AI와 함께 더불어 살아가야 하는 공존의 지혜에 대한 철학적 물음을 던져줄 것이다."},{"title":"짜장면 곱빼기에 수학이 들어 있다고?","pub":"서울: 사계절, 2024","desc":"우리가 일상에서 익숙하게 사용하고 있지만 수학과 관련이 있다는 사실은 잘 모르는 어휘 50가지를 소개하면서 숫자와 도형 관련 어휘부터 여러가지 관용어 등을 다루어 가나다순으로 잘 정리한 책이다.  만화, 간단한 정의, 실생활 예시 어휘로 구성되어, 보다 쉽고 유익하게 이해할 수 있는 흥미로운 요소들이 돋보인다.  이 책을 통해 평소 잘 알고 있다고 생각한 단어들을 새로운 시각으로 바라보며 우리의 말과 삶 속에 자연스레 녹아있는 수학적 언어들을 찾아가는 여행을 해보는 건 어떨까?"},{"title":"의성어 의태어 건축","pub":"파주: 안그라픽스, 2018","desc":"??첨단과학이 원시적 언어로 연결된다는 점이 재미있는 겁니다?? 송송송송, 첩첩첩첩 등 정겨움이 느껴지는 의성어와 의태어를 중심으로 경직되고 획일화된 건축을 넘어 자유롭고 유연한 사고가 구현된 구마겐고의 건축물과 그의 철학을 살펴볼 수 있는 책입니다. 못이나 접착제 없이 목재를 격자구조로 짜 맞춘 그의 삐죽삐죽한 건축물은 나뭇가지를 하나하나 정성껏 모아  만든 새의 둥지를 닮았습니다. 건축물이 소중한 생명체를 품고 있는 것만 같은 따뜻함도 느껴집니다. 왜 그럴까? 세계와 인간, 생물과 그 주위를 둘러싸고 있는 물질 등 저자가 책에서 강조하는 세상 모든 것의 수많은 상호관계성 안에 작고 힘없는 존재들까지 배제되지 않고 모두 똑같이 소중한 관계를 맺으며 포함되어 있기 때문이 아닐까요?"},{"title":"옛 그림 읽어 주는 아빠","pub":"서울:학고재,2015","desc":"??시중유화 화중유시(詩中有? ?中有詩)??    시 속에 그림이 있고, 그림 속에 시가 있다.  우리 옛 그림에 대해 알고싶어하는 어린이들을 위한 동양화 입문서입니다. 발음은 같지만 뜻이 다른 말, 상징적 의미를 갖는 특정 동식물을 활용한 수수께끼 같은 옛 그림을 통해 우리 선조들의 예술적 감각과 재치를 느껴 볼 수 있습니다.  전하고자 하는 마음을 그림속에 숨겨놓으면 그 의미를 헤아리려 하는 자의 낭만적인 해석이 더해져 그림의 의미는 더욱 부드러워지고 인간미가 부여됩니다. 4월의 봄, 쏘가리와 복사꽃이 어우러진 「도화궐어도」를 보며 아름다운 봄의 정취를 느껴보시는 건 어떠세요?"},{"title":"애니만 봤더니 일본어를 잘하게 된 건에 대하여","pub":"서울: 길벗이지톡, 2024","desc":"저자는 애니 덕질로 시작해서 3년 만에 JLPT N1을 취득하고 현재는 26만 구독자, 조회수 4천 만뷰를 기록한 일본어, 일본여행 전문 유튜브 크리에이터로서, 일본어를 기반으로 한 다양한 경력을 쌓아가고 있다. 저자는 언어를 ‘공부’가 아닌 ‘덕질’ 하라고 제안한다.   비전공자이자 일본애니메이션 덕후로서, 일본어에 대해 써 내려간 솔직한 경험기를 읽다 보면 일본어를 재미있게 배우는 방법, 일본어를 지속적으로 즐길 수 있는 힌트, 나아가 인생에 필요한 마인드셋 포인트도 얻을 수 있다."},{"title":"세계사 탐정 코난.4, 마르코 폴로 미스터리","pub":"파주: 아울북, 2023","desc":"어린이를 위한 세계사 학습 만화로 만들어진 이 시리즈는 〈명탐정 코난〉의 명성 그대로 흥미진진한 추리 스토리와 유익한 세계사 지식을 제공한다. 특히 이 책에서는 유럽에 아시아를 알린 《동방견문록》의 저자인 마르코 폴로를 다룬다. 그 당시 유럽과 아시아를 누비며 활약했던 모험가들의 흥미진진한 이야기 뿐만 아니라 대항해 시대 무역에 관한 역사적 지식도 함께 담겨 있다. 어린이 독자들은 시간 여행 스토리 속에서 역사적 지식을 폭넓게 익히며, 《동방견문록》에 담긴 흥미로운 이야기, 책을 둘러싼 논란, 13세기 베네치아의 흥미로운 역사도 함께 탐험할 수 있다."},{"title":"사람의 향기","pub":"서울: 유노북스, 2025","desc":"품격 있는 사람으로 살아가고 싶은 사람들을 위한 모든 가르침이 담겨 있다. 사람답게 살아가는 법부터 과거를 보고 미래를 읽는 법, 운명에 대처하는 법과 고난 속에서도 기회를 보는 법, 끊임없이 성장할 수 있는 법 그리고 치우치지 않고 균형을 이루는 법을 안내한다. 이를 알고  실천하기만 한다면 누구라도 그윽한 향기를 지닌 사람으로 거듭날 수 있다. 진정으로 품격 있는 사람은 내면의 깊이가 겉으로 드러나는 사람이다. 이 책이 삶에 깊이를 더하고 내공을 채울 수 있도록 도와줄 것이다. 오래도록 여운을 남기는 사람이 되고 싶다면, 애쓰지 않아도 온화한 정취를 자아내는 사람이 되고 싶다면 지금이야말로 인생에 향기를 더할 때다. 본받을 만한 그윽한 인품을 지닌 어른이 부재하는 현시대에 《사람의 향기》가 품격을 갖춘 삶에 대한 새로운 기준이 되어 줄 것이다."},{"title":"두 번째 달에게","pub":"파주: 자음과모음, 2025","desc":"이곳은 두 개의 달이 뜨는 세상, 평행 우주가 존재하는 세계다.  교통사고로 과거의 기억을 잃은 주인공 시은은 아빠의 바람대로 다른 아이들에게 뒤처지지 않기 위해, 잃어버린 기억을 찾기 위해 끊임없이 노력한다. 하지만 심한 두통과 함께 너무나 생생한 꿈이 자꾸만 떠오른다. 꿈속에서 자신은 두려움에 떨며 아빠를 피해 숨어 있다. 그리고  하늘에는 언제나 한 개의 달만이 떠 있다. 혼란스러움과 불안함이 계속되던 어느 날, 시은은 기억을 잃기 전의 자신을 알고 있는 듯한 여자 아이에게 충격적인 사실을 듣고 마는데……."},{"title":"(성적 초격차를 만드는)독서력 수업","pub":"서울: 빅피시, 2025","desc":"유아,초등 시기 독서력을 차근차근 쌓은 아이들은  중,고등학교에 진학해 성적을 급상승 시킨다?  \"독서 교육의 결과는 당장 눈에 보이지 않지만, 꾸준히 쌓아 올렸을 때 결국 아이의 학습에서 가장 큰 힘을 발휘한다\" 고  이 책의 저자는 말하고 있다. 대치동 ‘논술 화랑’ 에서 26년간  수만명의 아이를 가르쳐온 그는 연간 1만명 이상의 부모들이 주목하는 논술 화랑의 독서 수업의 비밀을 이 책에 담았다.  책과 친해지는 실질적이고 구체적인 노하우,  독서 교육 로드맵이 궁금하다면 이 책을 펼쳐보기를 추천한다."},{"title":"뚱뚱한 기분","pub":"파주: 다산어린이, 2024","desc":"“자신을 미워하게 된 한 아이의 이야기”    만화와 그림그리기를 좋아하는 평범한 남자 아이 윌.    윌은 어느날 너무 뚱뚱한 자신의 모습을 미워하게 되고,  온종일 주변사람과 다른 자기 자신을 미워하느라 자신의 원래 색깔을 하나씩 잃어간다. 자신감을 잃어가며 원래의 모습과 점점 달라지는 윌의 모습에 가장 친하던 친구들과도 서서히  멀어지고 윌은 혼자가 되는데..   어느날 우연히 스케이트 보드를 타던 소년 마커스를 만나고 그와 속내를 터놓으며 점점 마음의 문을 열게 된다.   윌은 과연 자신의 색깔을 되찾을 수 있을까?"},{"title":"말은 안 되지만","pub":"파주: 자음과모음, 2024","desc":"\"싫으면 달려, 최고가 되라고, 일등 말이야 다 최고가 되면 뭐가 남는 겁니까? 고기가 남지. 최고가 아니면 나머진 다 고기,  그게 이 세계의 룰이야.“  소설의 화자는 말은 안 되지만 어느 날 말이 되어버립니다. 돼지나라에서 태어난 말의 운명은 어떻게 될까요? 돼지들은 말을 혐오합니다. 돼지들은 말이 된 나를  돼지랑 비슷하게 만들려고 합니다. 겨우 도망친 나는 결국 원치 않은 경주마가 되어 버립니다. 돼지들의 즐거움을 위해 달려야 하는 말이 된 ‘나’는 우리의 현실을 빗대어 보게 합니다."},{"title":"왜 우리 엄마는 매일 출근할까요?","pub":"서울: 피카주니어, 2024","desc":"엄마가 매일 집에 있으면 얼마나 좋을까' 일하러 나가는 엄마를 향한 아이들의 질문은 계속 이어집니다. 사남매는 엄마와 더 오래 함께 있고 싶어합니다.  하지만 출근하는 엄마를 매일 붙잡을 수도, 서운해 할 수도 없습니다. 그래서 엄마의 일을 이해해보기로 합니다. 워킹맘과 아이들의 마음을 위로해 주는 따뜻한 그림책입니다."},{"title":"존재의 역사","pub":"군산: 오픈도어북스, 2025","desc":"이 책은 인류가 자신의 존재를 정의하고 발전시켜온 역사와 함께 철학, 과학, 예술이 인류의 삶에 어떤 영향을 미쳤는지를 탐구한다. 과거의 생명체들이 살아남기 위해 적응해온 방식과, 우리의 미래는 어떠한 길로 나아갈 수 있을지에 대한 질문도 함께 던진다. 언뜻 책 제목과 주제의 깊이가 다소 심오하고 어렵게 느껴질 수 있겠지만, 의외로 유익하고 흥미로운 과학 지식들을 선사하면서, 쉽고 재미있게 읽을 수 있는 내용들을 담아냈다. 나와 내 주변 사람들이 살아가는 이 세계에 대한 이해와, 더 나아가 인간의 존재와 우리의 미래에 대한 깊이 있는 통찰의 세계를 경험하는 소중한 시간을 함께 느껴보자."},{"title":"우리 토마토는 특별해","pub":"서울: 라이브리안, 2025","desc":"오랫동안 세계 곳곳의 빈곤과 여러 사회경제적 문제에 관심을 가지고 연구 및 실험을 진행하여 노벨 경제학상을 수상한 학자 에스테르 뒤플로의 그림책이다. 부유한 농민들의 욕심으로 셀레니네 마을 우물이 말라 버린 ?문제를 해결하기 위해, 물을 적게 쓰는 새로운 작물을 심고 좋은 품질의 농산물을 올바르게 판매하려는 사람들의 노력에 대한 이야기를 그려낸다. 이 책이 담고 있는 이야기는 지금도 지구의 여러 나라들에서 실제로 일어나고 있는 일이다. 어쩌면 나와 이웃의 문제, 결국은 우리 모두의 것이 될지 모를 문제들에 대해 함께 생각해보는 소중한 기회를 이 책을 통해 얻을 수 있을 것이다."},{"title":"든든한 구조대","pub":"서울:appletreetales,2018","desc":"자연재해나 인재가 생길 때마다 사고 현장에 가장 먼저 달려가 우리를 도와주는 구조대에 대하여 살펴볼 수 있는 책입니다.  페이지마다 있는 플랩들을 들추어 보면서 달리는 응급실 구급차 안에서는 어떻게 환자를 돌보는지 , 해상구조선은 어떻게 뒤집히지 않게 설계 되었는지, 소방 비행기의 물 공급은 어떻게 이루어지는지 등 여덟가지 구조대에 대해  재미있고 쉽게 학습할 수 있습니다. 지난 3월 마지막 주 제일 위험한 산불사고 현장에서 한 사람의 생명이라도 더 살리기 위해, 한 그루의 나무라도 더 지키기 위해 뜨거운 불과, 강풍에 맞서 고생하신 구조대원들의 노고와 사회 재난구조 시스템에 대한 고마움을 느끼며 책을 읽어보기 바랍니다."},{"title":"단색화 미학을 말하다","pub":"파주:마로니에북스,2015","desc":"\"기氣가 기技를 제압한다“ ? 박서보 -  1970년대에 한국에서 태동하고 전개되어 한국 미술사에 중요한 흐름을 형성해 온 단색화 작품의 가치와 생명력에 대해 설명해 주는 책입니다. 책은 크게 단색화 미술시장에 대한 분석, 단색화의 구축과정 그리고 주요 작가 5명에 대한 작가론으로 구성되어 있습니다. 단색조임에도 불구하고 묘한 기장감과 강한 인상을 주는 단색화 작품의 매력은 무엇일까? 마치 휴화산(休火山)처럼 격력한 화산 폭발의 카오스(Chaos) ‘혼돈‘, ‘무질서’의 상태를 겪고 난 뒤에 찾아온 평온함과 아직 내면 깊숙한 곳에 잠재하고 있는 뜨거운 마그마(magma)와 같은 감정의 절제를 화폭에 모두 담고 있기 때문은 아닐까요?"},{"title":"우리가 처음 사피엔스 였을 때","pub":"파주: 사계절, 2025","desc":"고고학의 연구 대상은 가늠하기 어려운 긴 시간을 견뎌낸 잔해이다. 저자는 우리나라를 대표하는 고고학자로서, 원시시대의 생활방식과 현재의 생활방식은 본질적으로 다르지 않음을 역설한다. 이 책은 30만 년 전 등장한 현생인류의 직접 조상인 호모 사피엔스가 만들어낸 특별한 능력에 관한 이야기를 담았다.  ‘원시’라는 고정관념을 걷어내고 우리 인간이 처음 사피엔스였을 때의 모습을 탐구해볼 수 있는 기회를 제공한다."},{"title":"게임보다 더 재미있는 게 어디 있어!","pub":"서울:팜파스,2018","desc":"이 책은 우리말 풀이에 짤막하고 재미있는 일화를 더해 국어  공부의 밑거름이 될 수 있도록 도와주는 책이다. ‘ㄱ’(기역)부터 ‘ㅎ‘(히읗)까지 각각의 자음으로 시작하는 재미있는 우리말을  선별하여 어린이 독자들이 아름다운 우리말의 가치와 의미를  깨닫고 긍지를 갖도록 돕는다. 학교에서뿐만 아니라 모든 일상생활 속에서 재미있고 아름다운 우리말의 의미를 알고 사용하다 보면 나도 모르는 사이에 국어실력이 쑥쑥 오르는 멋지고 놀라운 경험을 하게 될 것이다."},{"title":"악마와 함께 춤을","pub":"서울: 흐름, 2024","desc":"누르기 힘든 시기, 질투. 숨기기 힘든 분노, 경멸. 악마같이 느껴지는 이 감정들을 저자는 오히려 받아들이라고 말한다. 우리는 보통 이성과 감정은 상극이며, 감정은 뇌의 화학 반응일 뿐이므로 이성으로 통제해야 한다는 통념을 갖고 있다. 이 책은 이에 반하여 부정적인 감정은 잘못된 것이 아니기 때문에 이로부터 벗어나려 할 필요가 없고, 부정적인 감정이 삶을 풍요롭게  할 수  있다고 설명한다. 이 책을 통해 악마 같은 감정들과 춤추며 삶을 가꾸는 방법을 배울 수 있을 것이다."},{"title":"율의 시선","pub":"파주: 창비, 2024","desc":"시선을 마주치기 두려워하는 주인공 안율이 친구 이도해와 친해지고, 점점 다른 아이들과의 교류를 통해 서로의 상처를 마주하면서 타인의 시선을 궁금해하게 되는 이야기이다. 눈을 통해 다른 사람의 진심을 마주하게 된 율은 ‘진짜 친구＇의 의미를 깨달을 수 있을까? 작가의 말을 마지막으로 추천사를 마친다. ‘이 이야기는 그 시선에 관한 이야기입니다. 주인공 율의 시선이기도 저의 시선이기도 합니다. 부디 이 시선이 여러분의 가슴 속에 오래 남길 바랍니다.’"},{"title":"부모의 질문력","pub":"서울: 다산북스, 2025","desc":"아이가 스스로 깨닫게 하기 위해서는 적절한 질문이 중요하다. 휴지를 버리는 아이가 있다고 하자. 저자는 휴지를 버리면 안 되는 이유를 무한정 설명하는 것보다 간단한 질문으로 아이의 생각만 자극하는 것이 더 효과적이라고 말한다. ＂네가 버린 휴지는 앞으로 어떻게 될까?＂  버려진 휴지의 삶을 스스로 상상하게 하면 아이는 조금씩  스스로 생각하는 힘을 기를 것이다. 이처럼 이 책에는 아이의 사고력을 확장할 수 있는 질문법이 담겨있다. 아이와 부모의 질문을 쌓아 올려 근사한 책을 만들어 보자."},{"title":"오~ 재수 있다!","pub":"고양: 책딱지, 2023","desc":"초등 3학년 오재수는 이름 때문에 ‘재수 없는’ 오재수로  반친구들에게 놀림을 받아요. 조금이라도 안 좋은 일이 생기면 어김없이 이름 탓을 하는 재수는 재수 없는 운명에서 벗어나기 위해 이름을 바꾸기로 결심하지요. 하지만 할아버지가 작명소를 백 군데도 넘게 다니면서 지어 준 귀한 이름이라  가족들은 재수가 아무리 이름을 바꿔 달라고 졸라도 꿈쩍도  하지 않아요. 결국 재수는 생각다 못해 스스로 이름을 바꾸고 밤새 이름표까지 만들어 가슴에 붙인 다음 학교로 향하지요.  자기 이름에 진저리가 난 재수는 자기 이름을 바꿀 수 있을까요?"},{"title":"슬픔에 이름 붙이기","pub":"파주: 윌북, 2024","desc":"우리는 때때로 말로는 마음을 다 담지 못한다고 느낄 때가 있습니다. 이 책은 슬픔에 관한 어휘들을 만든 신조어 모음집으로 그동안 미처 다 담지 못했던 우리 내면의 이야기를 조금이나마 알 수 있게 합니다. 또한 세상을 이루고 있는 슬픔에 이렇게 많은 종류가 있는지, 그것을 나 혼자만 느낀 것이 아니라고 깨달으면서 위로가 됩니다. 평소에 단조로운 말들에게 결핍을 느꼈다면 이 책의 신조어를 활용해 보다 풍성하고 아름다운 표현들을 만나보세요."},{"title":"고양이는 발끝 하나 까딱하기 싫어","pub":"서울: 북멘토, 2024","desc":"너무 귀여운 고양이의 모습과 표정이 요즘의 우리들의 모습을 보는 것 같은 공감이 느껴져서 보게 되는 책입니다. 고양이는 발끝하나 까딱하기 싫어합니다. 고양이 '그레그'에게 친구들이 같이 파티에 가자고 해도, 함께 스케이트를 타고, 그림을 그리고, 춤을 추자고 해도 그레그는 모두 거절합니다. 그러자 친구들은 모두 그레그처럼 아무것도 안하기로 하고 누워있기로 합니다. 서로의 마음을 공감하며 해결해 가는 재미있는 이야기입니다."},{"title":"단어가 품은 세계","pub":"서울: 빛의서가, 2024","desc":"│책 소개 이 책은 단어의 탄생, 성장, 쓰임에 대해 문학, 역사, 철학, 종교 등을 넘나들며 독자들로 하여금 언어 속 수천 년 역사를 마주하게 한다. 저자는 우리가 매일 쓰면서도 몰랐던 단어의 비밀 뿐만 아니라 단어를 탐구하며 마주한 인간 삶에 대한 통찰을 흥미진진하게 전한다. 사람들의 가장 가까운 곳에서 쓰이는 단어 속에 사랑과 긍지, 땀과 애환, 성공과 좌절, 인간관계와 고민 등이 어떻게 담겨 있는지 생생히 보여준다."},{"title":"(어린이를 위한)역사의 쓸모: 인생편.1, 용기","pub":"파주: 다산어린이, 2023","desc":"이 책은 선택의 기로에서 큰 용기를 냈던 열두 명의 역사 속  인물의 삶이 담겨 있다. 저자는 역사 속 인물들의 이야기가 사람을 만나는 공부이자 그들에 대한 뒷담화이기도 하기 때문에 재미있다고 말한다. 어린이 독자들은 열두 명의 인물의 삶을 들여다보며, 암기 위주의 역사 공부에서 벗어나 자신의 인생을 바꾸는 역사의 즐거움을 깨닫게 될 것이며, 인생에 필요한 답을 스스로 찾아 나갈 수 있게 된다."},{"title":"(지구를 위한) 분해 연습","pub":"서울: 너머학교,  2024","desc":"천재 물리학자 리처드 파인만(Richard P. Feynman, 1918 ~ 1988)이 어렸을 적 이웃들의 고장난 라디오를 고쳐주는 것을 수수께끼 놀이처럼 즐겼었다는 사실을 알고 있나요? 이 책은 마치 파인만의 놀이과정을 기록해 놓은 듯 우리가 일상생활에서 사용하는 전자제품의 분해과정을 생생한 사진으로 보여주고 기계의 작동원리와 내부구조, 다양한 부품들의 기능까지 살펴 볼 수 있도록 구성되어 있습니다. 분해를 통해 부품의 재료인 구리, 철과 같은 자원과 그 자원의 생산지역 지리까지 그리고 여기에 재료의 재순환, 재창조 등 자원의 흐름과 지구환경까지 생각해 본다면 책을 통해 더 많은 것을 배울 수 있겠죠?"},{"title":"옛것에 혹하다","pub":"파주: 돌베개, 2025","desc":"＂만 권의 책을 읽고 만 리의 길을 걸으면(讀萬卷書 行萬里路), 가슴속에 온갖 더러운 것이 제거되어 절로 구학이 마음속에서 생기고, 산수의 경계가 만들어져 손 가는 대로 그려내니 이 모두가 산수의 전신이다.” -『화안』, 동기창(1555 ~ 1563)  저자가 인산동 골목길에서 고미술과 함께한 50년동안 경험한 작품 중 80개 명작품과의 깊은 인연 그 안의 특별한 이야기를 들려줍니다. 작품에는 작가의 ‘혼(魂)’이 담겨있기 때문일까? 돈보다는 작품과 소장가의 사이의 인연으로 이루어지게 되는 만남의 이야기들이 흥미롭습니다. 예술가의 삶이 아닌 삶 속의 예술, 옛어른들의 풍류를 만나보실까요?"},{"title":"스위트 스팟","pub":"서울: 북플레저, 2025","desc":"이 책은 저자가 오랜 강의와 개인적 성찰을 통해 젊은 세대들에게 전하는, 자신만의 질문을 던지고 그 답을 찾아가는 과정의 힘 '균형', 즉 ‘스위트 스팟’에 대한 이야기이다. 스위트 스팟이란 내가 가지고 있는 기회를 찾고 삶의 균형을 찾아내는 것이며 끊임없이 변화하는 상황을 받아들이고 적응해 나아가는 과정이라고 말한다.   다른 누군가가 아닌 나에게 초점을 두고 내적 균형을 맞춰가며 나만의 '스위트 스팟'에 올라설 수 있도록 마음의 씨앗을 심는 계기를 이 책을 통해 마련할 수 있을 것이다."},{"title":"세상을 바꾼 위대한 발견","pub":"인천: 놀이터, 2025","desc":"우리가 사는 세상은 다양한 물질과 에너지의 결합인 '물건'들로 가득하다. 이 책은 세상을 이루고 있는 다양한 물질들에 대한 이야기이며 물건의 기본적인 개념, 지구를 이루는 천연자원과 생태계, 인간이 만들고 사용하는 발명품, 이 세 가지의 내용을 바탕으로 흥미로운 내용들을 전개한다. 각 개념과 파트가 간결하며 흥미롭게 엮여 있고 내용의 이해를 돕는 독특한 일러스트도 함께 더해져 아이들의 눈높이에 맞는 신기하고 재미있는 과학 이야기들을 들려줄 수 있을 것이다."},{"title":"철학자와 오리너구리","pub":"파주: 알키미스트, 2025","desc":"많은 사람들이 이름을 듣기만 해도 하품을 할 철학자(Plato)와 오리인지 너구리인지 헷갈리게 생긴 오리너구리(Platypus)가 함께 술집에 들어가 수다를 떠는 것으로 이 책의 각 챕터는 시작된다. 하버드 철학과 출신 코미디 작가인 두 저자는 난해하며 지루할 수 있는 철학적인 주제들을 쉽고 가벼운 농담을 통해 풀어낸다. 철학 공부를 위해 어려운 용어와 개념을 외우려고 애써 노력할 수도 있지만, 이 책에서 저자들이 쉴 새 없이 보여주는 온갖 시시껄렁한 농담을 피식거리며 읽다 보면 나도 모르게 철학적 사고를 기를 수 있을 것이다."},{"title":"스파클","pub":"파주: 창비, 2025","desc":"주인공 배유리는 오 년 전 사고로 오른쪽 각막을 이식받았다. 동생 영이는 같은 사고로 식물인간이 되었고, 온 가족이 동생에 대한 죄책감을 가지고 힘겹게 살아가고 있다. 유리의 아빠는 동생을 위해 의대에 진학하라고 하지만, 유리는 방황한다. 피로로 왼쪽 눈에 염증이 생긴 유리는 기증받은 오른쪽 눈에서도 눈송이를 보게 되었고, 자기에게 각막을 기증해 준 사람이 궁금해진다. 눈 오는 계절 학원도 빠지고 기증자의 자취를 찾아 나서는 유리는 여행 끝에 무엇을 발견할 것인가."},{"title":"부서지는 아이들","pub":"파주: 웅진지식하우스, 2025","desc":"부모에게 의존적인 아이들이 점점 늘어나고 있다.  전례없이 부모의 지원과 배려를 받아온 세대는 부족할 것 없이 튼튼할 것만 같았지만 오히려 가장 취약하고 의존적인 어른으로 자랐다.   이 책은 감정존중 양육의 문제점으로 양육의 외주화,  부모 권위의 부재를 들고 있다.  또한  이러한 양육방식에 따라 아이들이 어떻게 자립하지  못하게 되는지를 설명하며 아이의 삶에서 한발 물러날 용기를 가지라고 말하고 있다."},{"title":"이웃집 빙허각","pub":"파주: 창비, 2024","desc":"세상이 원하는 나의 모습과 내가 원하는 나의 모습 사이에서 갈등하는 한 여인의 이야기.  매일 새벽, 일렁이는 마음을 안고 언덕에 올라 강 저편의 세상을 궁금해하던 덕주는 우연히 이웃집 할머니를 만나게 된다.   덕주는 할머니가 살림에 관한 책을 쓰고 있다는 사실을 알게 되고 남몰래 할머니가 책 쓰는 일을 돕겠다고 결심한다. 여인은  오로지 자신을 낮추며 살아야 한다는 아버지의 말씀과 세상  밖으로 자신의 뜻을 펼치고 싶은 마음 사이에 덕주의 고민은  커져만 가는데.. 과연 덕주는 자신의 꿈을 지켜낼 수 있을까?"},{"title":"이중 하나는 거짓말","pub":"파주: 문학동네, 2024","desc":"새로 전학 온 채운에게 선생님은 다섯문장으로 자기 소개 하는데 그 중 하나에는 반드시 거짓말이 들어가야 하고 소개가 끝나면 다른 친구들이 어떤 게 거짓인지 알아맞히게 합니다. 저마다의 사정으로 괴로워하는 지우, 소리, 채운 세 명의 등장인물이 서로에게 한 가지 씩의 거짓말을 하고 그 과정에서 서로의 비밀을 알게 되는 이야기입니다. 우리는 때로 진실이 너무 고통스럽거나 밝힐 수 없기 때문에 거짓말을 합니다.하지만 왜 거짓을 말했는지 생각해보면 진실을 알 수 있습니다. 이 도서는 우리가 각 인물이 처한 감정에 공감하게 하면서 인간관계의 복잡성과 진실의 다양한 모습을 보게 합니다."},{"title":"난 잘 도착했어","pub":"고양: 책빛, 2024","desc":"부모님 없이 처음으로 혼자 가지않았던 길을 가보는 경험은 누구에게나 두렵고 불안합니다. 처음으로 부모님 없이 혼자 가지 않았던 길을 가보는 경험을 하는 아이는 아무도 없는 별에 혼자 떨어진 것 같다고 합니다. 하지만 조금씩 새로운 풍경을 보게 되고 안도감을 느끼게 됩니다.  이 책은 우리가 한번쯤은 있을 만한 새로운 도전과 경험으로 두려움을 갖을 수는 있지만 해낼 수 있다는 응원을 전해줍니다."},{"title":"호라이즌","pub":"서울: 북하우스, 2024","desc":"이 책은 전미 도서상 수상 작가인 저자가 자신의 여행 경험을  집대성한 책으로서, 북극, 남극, 북태평양, 남태평양, 아프리카, 호주 등 여섯 지역을 하나의 교향곡처럼 재구성한 논픽션이다.  ‘여행’은 저자에게 지혜를 모으는 활동이자 자신을 바꾸는 행동이다. 저자는 탐험과 여행을 둘러싼 인류의 오랜 역사를 흥미진진하게 들려주는 한편, 인류학, 지질학, 생물학, 윤리학 등 다양한 영역의 주제들을 탐색해 나간다. 저자가 보여주는 지구 곳곳의 과거와 현재는 독자들에게 황홀함을 선사한다."},{"title":"(그림일기로 배우는)초등 생활 어휘","pub":"서울: 제제의숲: 심야책방, 2024","desc":"초등학교 저학년이라면 충분히 있을 법한 재미있는 생활 이야기를 그린 그림일기 속에 필수 생활 어휘를 담은 책이다. 이 책은 초등 저학년 필수 생활 어휘 100개를 선별하여 어린이 독자들이 집이나 학교에서 쓰는 여러 가지 어휘를 명확히 이해하고 적재적소에 쓸 수 있도록 구성했다. 이를 통해 어린이 독자들의 어휘력과 문해력을 높여 줄 뿐만 아니라 그림일기를 통해 겪은 일, 생각이나 느낀 점을 표현하는 방법, 띄어쓰기, 문장 부호 사용 방법까지 한번에 배울 수 있다."},{"title":"지워진 천문학자들","pub":"서울: 영진닷컴, 2025","desc":"이 책은 여성이라는 이유로, 유색인종이며 소수민족이라는 이유로 천문학계에서 인정받지 못했던 잊혀진 여성과학자들의 생애를 조명하고 있다. 노벨물리학상 수상자들의 극찬을 받은 이 책은 천문학, 물리학, 우주공학 및 역사를 넘나드는 그들의 이야기를 생생하게 되살려냈다. 저자는 사회적 편견과 차별이라는 벽 앞에서 좌절하지 않고, 오직 천문학을 향한 뜨거운 열정과 부당함에 맞서는 용기로 자신의 능력을 증명해낸 그들의 이야기와 함께 천문학 이론과 과학사를 흥미진진한 이야기 속에 녹여냈다. 이 책을 통해 우리들은, 당시 여성과학자들이 겪었던 차별이 단순히 과거에 머문 이야기가 아닌 현재 우리 사회에도 여전히 직면해있는 문제임을 다시금 느끼게 될 것이다."},{"title":"신비한 지식 박물관, 문화","pub":"서울: 그린애플, 2025","desc":"문화'와 관련된 교과서 필수 개념들을 재미있게 배울 수 있는 새로운 문화교양서이다. 환상 동물인 용과 드래곤 요정들이  책 속에 등장하며 주인공 시은이와 함께 하는 신비한 박물관에서의 이야기들이 담겨있다. 그곳에서 세계의 다양한 문화들을 배우게 되면서 벌어지는 다양한 이야기와 사건을 다룬다. 아이들의 관점에 맞게 잘 설명되어 있는 알찬 구성과, 편견 없이 다양한 문화를 이해하고 받아들일 수 있도록 도와주는 다채로운 이야기들을 이 책을 통해 만날 수 있을 것이다."},{"title":"청라 이모의 오순도순 벼농사 이야기","pub":"서울: 토토북, 2023","desc":"팍팍한 도시의 삶을 뒤로하고 작은 산골마을로 귀농한 초보농부의 우당탕 벼농사 이야기입니다. 자연의 순리대로 무리하지 않고 사는 정 많고 부지런한 농부의 사계절을 만나볼 수 있습니다. “아가씨가 피사리 한다고 욕보는구마. 근데 피가 뭔지는 알고 하는 거요? 옛날에 도시서 온 어떤 사람은 피 뽑는다고 벼를 다 뽑은 적도 있데이“ 잡풀들이 무섭게 자라는 여름에는 벼가 다른 풀에게 거름기를  빼앗기지 않도록 풀 매는 일을 해줍니다. 나는 피와 벼를 제대로 구별할 수 있는 사람인가? 제한된 시간의 삶 속에서 내가 정말로 지키고 싶은 소중한 가치를 위해 어떤 것을 피하고 버려야 하는 것인지 고민해 보게 됩니다."},{"title":"최소한 그러나 더 나은","pub":"서울: 위즈덤하우스, 2024","desc":"\"..그 핵심은 이 세상을 모든 사람이 살아갈 가치가 있는 내일을 맞이할 수 있는 장소로 만들어가는 방법을 진지하게 고민하는 데 있다.\"  군더더기 없이 매끈하고 깔끔한 디자인으로 유명한 디터 람스의 디자인 철학과 신념을 만나 볼 수 있는 책입니다. 그가 인간의 삶을 바라보는 관점과 세상을 살아가는 방식에는 항상 세심한 배려가 묻어 있습니다. 사용자가 직접 자신만의 것을 채워 넣을 수 있는 여유를 남겨놓아 자유를 선물하는 그의 디자인에서 타임리스 디자인들이 공통적으로 나타내는 본질적 가치가 무엇인지에 대해서도 생각해 보게 됩니다."},{"title":"고백해도 되는 타이밍","pub":"서울: 우리학교, 2025","desc":"주인공 지민은 자칭 ‘집도 별로, 공부도 별로, 외모도 별로‘ 인 평범한 사람이지만 예쁘지 않은 자신의 외모를 맘에 들어하며, 친구 현서의 비싼 가방이나 깨끗한 피부가 아닌 ‘사랑받고 자란 티‘, ‘당당한 말투와 꼬이지 않은 성격＇을 부러워하기도 한다. 어쩌다 허언증이라는 오해로 급식을 먹어야 하는 처지지만, 동아리에 들고 새로운 관계를 만들며 좋아하는 아이도 생기게 된다. 그러나 현서가 그 아이는 자기가 먼저 좋아했다고 말해오는데… 지민은 과연 고백해도 좋은 타이밍을 잘 잡을 수 있을까?"},{"title":"경험의 멸종","pub":"서울: 어크로스, 2025","desc":"『경험의 멸종』은 문화비평가이자 역사학자인 크리스틴 로젠이 디지털 기술이 인간의 본질적인 경험을 어떻게 잠식해 가는지를 통찰한 책입니다. 날씨 앱, 인공지능, 비대면 플랫폼 등 편리함을 위한 기술들이 감각과 감정, 기다림의 시간, 공공성 같은 인간 고유의 경험을 대체하고 있다는 점을 날카롭게 지적합니다. 저자는 손글씨와 직접 그리기를 통한 학습, 대면 소통의 가치, 실패와 지루함의 의미를 되새기며, 신체적이고 감정적인 경험이 인간다운 삶의 핵심임을 강조합니다. “기계에 연결된 기억 없는 쾌락”을 선택할 것인가, 아니면 스스로의 의지로 경험을 회복할 것인가라는 질문을 던지며, 기술에 잠식당하지 않는 자아와 공동체의 회복을 촉구합니다. 인공지능 시대를 살아가는 우리에게 깊은 성찰을 안겨주는 책으로, 모든 세대에 권할 만한 철학적 에세이입니다."},{"title":"부모의 말 수업","pub":"서울: FIKA, 2025","desc":"\"엄마 언제와요?\"라는 물음을 10번이 넘도록 물어보는 아이의 속마음은 무엇일까?  \"빨리 안 오면 엄마 혼자 간다!＂ 처럼 습관적으로 튀어나오는 강압적인 말들로 후회해본 적이 있는가?  이 책은 아이의 말 속에 담긴 욕구, 자동적으로 튀어나오는  말습관들을 살펴보며 더 효과적인 소통방법을 제시한다. 뿐만 아니라 발달 수준에 따른 소통방법이 어떻게 달라지는지, 원활한 소통을 위해 아이와 부모에게 필요한 것이 무엇인지  말하고 있다."},{"title":"(학교 옆) 만능빌딩","pub":"서울: 비룡소, 2025","desc":"제14회 비룡소 문학상 수상작!  친구와 화해하지 못해 답답한 재이의 이야기.  학원이라면 안 다녀 본 곳이 없는 아이 재이. 하지만 아무리  학원을 많이 다녀도 배울 수 없던 한 가지가 있었으니 바로  친구와 다시 잘 지내는 방법이다. 재이는 우연히 만능빌딩 6층 임대 학원에서 수상한 욕쟁이 할머니를 만나 ‘지는 게 이기는 법’이라는 알쏭달쏭한 이야기를  들으며 관계의 진실에 대해 조금씩 힌트를 얻기 시작하는데…. 재이는 과연 친구와 다시 잘지낼 수 있을까?"},{"title":"0","pub":"서울: 위즈덤하우스, 2025","desc":"통장잔고 0, 인간관계 0, 행동반경 0, 메신저 알림0의 본인의 일상을 다룬 만화0000을 연재하던 주인공의 죽음에서 시작됩니다. 저승에 가기 전 ‘오후’라는 고양이가 주인공을 납치합니다. 고양이는 사람들 앞에서 존재감이 없어지는 비결을 물어보며 자신의 부탁을 들어주면 주인공을 환생시켜 주겠다고 제안합니다. 아홉 개의 생명을 가진 고양이가 여덟 번째 삶을 사는 동안 지켜본 인간 중 가장 존재감이 없었기 때문입니다. 주인공은 오후가 최선을 다해 살아온 날들과 오후가 전해준 위로와 노력으로  마침내 희망과 용기를 얻습니다."},{"title":"나는 돌이에요","pub":"서울: 문학동네, 2024","desc":"\"나는 백만살이에요. 나는 말이 없지만 어제를 기억해요. 나는 발이 없지만 오늘을 살아요.\" 돌 중에는 우리보다 짧은 생을 산 돌은 없습니다. 오랜 세월동안 여러 어려움들 속에서 묵묵히 자기의 자리에서 할 일을 하며 삶을 버틴 돌의 마음을 바라볼 수 있습니다.  어제를 기억하고 오늘을 살면서 돌처럼 열심히 구르며 이리저리 치이는 것이 인간의 삶과 닮았습니다. 이 책은 돌의 마음을 들여다보면서 자연스럽게 우리의 삶을 생각하게 해줍니다."},{"title":"미드영어, 난 에피소드 하나만 판다!: 시트콤편","pub":"성남: Mentors, 2025","desc":"미국드라마를 통해 영어 실력이 향상된 미드족의 경험에 따르면 하나의 에피소드를 처음부터 끝까지 독파하게 되면 영어 듣기와 영어회화 실력이 쑥쑥 올라가게 된다고 한다. 이 책은 영어공부에 도움이 되는 대표적인 시트콤에서 에피소드를 엄선하였다. 네이티브가 아니면 이해가 안되는 문화적 요소의 표현들, 이해하기 힘든 농담(joke)들을 친절하게 설명하였으며, 항상 걸림돌이던 문화, 조크들을 극복함으로써 영어실력이 향상된 자신을 발견하게 될 것이다."},{"title":"나의 처음 하와이 여행","pub":"서울: 말랑, 2025","desc":"엄마, 아빠를 따라다니기만 하는 여행이 흥미롭지 않은 어린이를 위한, 어린이 맞춤형 여행 가이드북이다. 이 책은 어린이들이 스스로 여행을 준비하고 계획할 수 있도록 한다.  하와이 필수 관광명소 8곳을 선별하여 현지 문화 상식, 화산 활동의 과학적 원리, 제2차 세계대전 등 학교에서 배운 교과 내용과 연계하여 어린이 독자의 여행이 지루하지 않고 평생 기억에 남도록 도와준다."},{"title":"코어 씽킹","pub":"서울: 북플레저,  2025","desc":"\"끝까지 가는 힘은 흔들리지 않는 '생각의 힘'에서 나온다\"  ‘행동’과  ‘결과’ 사이의 거리를 좁히기 위한 사고방식, 일의 핵심을 파고드는 사고법을 알려주며 세 번의 창업과 수많은  실패를 통해 저자가 스스로 세운 일의 본질 및 사고 프레임에 대한 핵심 내용을 정리한 자기 리더십 훈련서이다. 다양성은 확대됐지만 오히려 본질을 놓치기 쉬운 이 시대를 살아가는 우리에게 저자는, 결국 본질을 꿰뚫는 질문과  ‘자신만의 기준’이 진짜 경쟁력이 될 것이라 하며, 생각하는 방법과 그 생각의 실행력에 대한 물음을 우리에게 던진다. 이 시대를 견디며 살아가는 모든 사람들에게 이 책은 실전적이며 든든한 조력자가 되어줄 것이다."},{"title":"뇌가 궁금해","pub":"서울: 모알보알,  2025","desc":"소아신경과 전문의가 지은 어린이를 위한 뇌 과학 그림책이다. 우리 몸의 대장, ‘뇌’의 역할과 중요성을 이 책을 읽는 어린이들에게 쉽고 재미있게 일깨워준다. 여덟 개의 뇌를 가진 문어의 이야기를 통해 뇌가 얼마나 소중한지, 또 우리의 소중한 뇌를 어떻게 지켜야 하는지를 알 수 있도록 아이들의 시선에 맞춰 흥미롭게 담아냈다. 뇌와  관련한 유익한 배움에 더해진 다정하고 따뜻한 느낌의 이야기와 포근한 그림들이 이 책을 읽는 아이들에게 더욱 큰 즐거움을 더해줄 것이다."},{"title":"사람 보는 눈","pub":"서울:현암사,2013","desc":"\"그림 밖의 사람은 그런 것 같지만 그렇지 않은 사람이 많고, 그림 속의 사람은 그렇지 않은 것 같지만 그런 사람이 많다\"  미술평론가인 저자가 전해주는 옛 우리 그림 속 사람들과 풍경 이야기입니다. 이형사신(以形寫神), 형상으로써 정신을 그린다. 대상의 단순한 재현이 목적이 아니기에 그 인물의 삶과 내면이 동시에 보이는 찰나의 순간 눈빛과 표정을 예리하게 포착한 화가의 소리 없는 시선이 매우 날카롭게 느껴집니다. 무의식적으로 드러나는 나의 진짜 모습, 누가 보든 보지 않든 지금 이 시간과 장소의 교차점 위에서 매순간을 있는 그대로의 나 자신으로서 충실히 살아야겠다는 생각을 해봅니다."},{"title":"꿈을 이루는 밥 짓기","pub":"서울:아이들은자연이다,2016","desc":"\"매일 밥 먹는 것처럼 하면 못 할 일이 없다고 했어.“ '밥이란 무엇인가?' 대한 책입니다. 공기?흙?물-자연 생태계와 밥짓기, 전기밥솥?압력밥솥-과학기술과 밥 짓기, 혼자 먹는 밥?함께 먹는 밥-사회(나와 연결된 작은 공동체)와 밥짓기 등 밥과 관련된 많은 질문과 생각들이 고봉밥처럼 수북히 담겨있습니다. '짓다'라는 동사는 뚝딱뚝딱 휙하고 만드는 과정보다는 시간과 정성이 많이 들어가는 귀중한 행위에 쓰이는 단어라는 생각이 듭니다. ‘이름을 짓다‘, ‘시를 짓다＇?'밥을 짓다'. 세상의 모든 분야와 연결되어 있는 따뜻한 밥 한 그릇. 너무 평범하다고 실망하지 마시고 소중하게 생각해 주세요."},{"title":"다크 심리학","pub":"[서울]: 어센딩, 2025","desc":"기존의 심리학 책은 자기 내면을 들여다보고, 자기 효용감을 키우며 상대방에게 신뢰를 주는 방법을 알려주는 경우가 많다. 하지만 이 책은 그런 것과는 거리가 멀다. 인간관계에서 나도 모르게 끌려다니는, 누군가에게 통제당하고 있는 사람을 위한 ‘생존 설명서＇라고 할 수 있다. 인간의 어두운 본성을 무기삼아 나를 심리적으로 조종하는 사람에게서 벗어나기 위한 필독서! 하지만 조심하시라, 심연을 들여다보다간 심연도 당신을 들여다볼 것이다. 괴물에게서 탈출하는 방법을 배우다가 도리어 본인이 괴물이 되지 않게 주의하길."},{"title":"소금 아이: 이희영 장편소설","pub":"파주: 돌베개, 2023","desc":"“소금 바람 묻은 건, 쉬 상한다.”  어떤 것은 소금 때문에 변하고 상하기도, 반대로 어떤 것은 소금 때문에 변치 않고 그대로 남아 있기도 한다. 잘 모르면서 남을 쉬이 판단하는 사람들의 시선이 소금처럼 박히기도 하고, 남에게 말 못할 혼자만의 사정이 몸에 소금처럼 쌓이기도 한다. 하지만 한 사람이 많은 사람을 아프게 할 수 있더라도, 다른 한 사람으로 인해 많은 이들이 구원받을 수 있는 것처럼 그런 일들도 소금처럼 삶에 꼭 필요한 요소이다. 주인공 ‘이수’의 이야기를 따라가다 보면 인간애로 가득한 소금 눈물을 흘릴 수 있을 것이다."},{"title":"문해력 격차","pub":"서울: 어크로스, 2025","desc":"동영상은 텍스트를 대체할 수 있을까? 유튜브,AI등 책을 읽지 않고도 정보를 얻고 말할 수 있는 매체가 많아진 요즘, 읽는 능력에 대한 필요성에 의구심이 들 때가 있다. 이 책의 저자는 텍스트를 능동적으로 읽고 이해하는 과정을 통해 온전히 자신만의 정보를 얻을 수 있다고 말함으로써 문해력의 중요성을 강조하고 있다. ‘문해력은 가장 위대한 시민의 권리’라고 말한 카림위버(미국의 교사, 교육운동가) 의 말처럼 문해력을 기르는 것은 사회적 의무이자 책임일 것이다."},{"title":"감당 못 할 전학생","pub":"서울: 마음이음, 2025","desc":"‘우리’가 되는 어려움과 아름다움을 말하는 동화 외국에서 살다 우리 학교에 전학 온 서아담. 등교 첫날부터 하루 종일 눈을 감고 꿈쩍도 않더니 교실 창문을 열어 놓고 우리 말에는 대꾸도 하지 않는다. 아담이 전학 온 날부터 학교는 하루도 조용할 날이 없다. 온갖 이상한 놀이가 계속되는 와중에 친구들은 하나둘 아담 편에 서지만 결코 곁을 내줄 수 없다고 여기는 아이도 있다. 친구가 되고 ‘우리’ 안에 들어오는 일이 너무 쉬워서는 안 되니까. 좀 이상해 보이는 아담은 무사히 학교를 다닐 수 있을까?"},{"title":"오늘은 식물","pub":"서울: 드림데이, 2024","desc":"혹시 식물을 인테리어의 장식물처럼 보고 있지는 않나요? 하지만 저자는 집에 들이는 식물은 '반려식물’로 자연과 차단되어 자생력을 잃어버리기 때문에 스스로 살 수 없으며 우리가 항상 관찰하고 상태를 살피는 적극적인 노력이 꼭 필요하다고 강조합니다 그럼 왜 이런 노력들이 필요할까요?  '초록이 건네는 조용한 위로'란 책의 부제처럼 우리는 식물을 통해 생명력과 에너지를 얻을 수 있기 때문이라고 합니다. 매일 바쁘게 살다 보면 몸도 마음도 지치기 쉽습니다.  초록의 생기로 몸과 마음을 치유하고 활기가 생기기 바랍니다."},{"title":"잘 화내는 기술","pub":"파주: 잇츠북어린이, 2024","desc":"주인공 도룡이는 무슨 이유인지 친했던 다른 친구들이 자신을 따돌림하고 있어 화가 납니다. 이유를 확인해보니 세훈이의 달팽이가 죽었고 그 이유가 도룡이 때문이라고 합니다. 참을 수 없는 도룡이는 세훈이를 따라가서 화를 내게 되고 아이들은 도룡이를 비난하게 됩니다. 하지만 시간이 지날수록 자신의 오해와 세훈이에게 했던 행동들을 반성하면서 우연히 화를 잘 내는 기술을 알게 됩니다. 이 도서는 화를 어떻게 내고 해결할 수 있는지 다시 한번 생각해 보게 합니다."},{"title":"책의 계절","pub":"서울: 버터북스, 2025","desc":"저자는 오랫동안 책을 만들어온 북 디자이너이자, 서점, 도서관, 북 페스티벌 등 세계 곳곳의 책을 찾아다니는 ‘책 여행자’이다. 골목의 마지막 책방, 더 이상 대를 이을 사람이 없는 서점, 공공장소로서의 역할을 고민하는 도서관 등 최전선에서 책의 정원을 가꾸는 사람들에게 다정하게 말을 거는 저자를 따라가다 보면 여전히 책을 사랑하고, 책으로 소통하며, 책이라는 세상을 가꾸며 살아가는 사람들과 그들의 손길이 닿은 책, 그리고 공간 속에서 느림의 행복을 느끼게 된다."},{"title":"(얄라리의 어휘 콕콕!)한 컷 초등 맞춤법","pub":"서울: 휴먼어린이, 2025","desc":"초등학생이 꼭 알아야 할 맞춤법과 띄어쓰기를 간결한 설명과 재미있는 한 컷 그림으로 알려 주는 책이다. 교과서에 나오는 필수 맞춤법 및 어휘의 뜻과 실생활 쓰임새를 단번에 파악할 수 있는 예시를 그림 한 컷에 담았다. 한 컷 한 컷 그림을 펼치며 어린이 독자들은 자주 틀리는 맞춤법부터 서로 헷갈리는 낱말 구별하기, 올바른 띄어쓰기 방법까지 쉽고 빠르게 익힐 수 있다. 더불어 긴 글 읽기를 어려워하는 독자들도 부담 없이 공부할 수 있게 된다."},{"title":"에일리언 어스","pub":"서울: 쌤앤파커스, 2025","desc":"인류는 우주라는 미지의 세계에 무한한 호기심과 수많은 질문들을 키워왔고 그 세계에 가까워지기 위해 오랜 시간 탐구하며 노력해왔다. 이러한 우리가 우주에 품고 있는 오래된 미스터리 중 하나는 바로 우주에 다른 생명체가 존재하는가의 여부일 것이다. 이 책은 바로 그 질문에 대한 접근을 흥미롭게 풀어내고 외계 생명체의 존재 가능성과 함께 우주에 존재할 수 있는 다양한 생명체의 원리 및 그 정의에 대한 화두를 던진다. 신비로운 외계 생명체에 대해 과학적 사실을 통해 객관적으로 검증하면서도 전문 용어를 최대한 배제하여 우주 과학에 많은 관심을 가지고 있는 독자들로 하여금 깊은 재미와 공감을 이끌어 낼 수 있을 것이다."},{"title":"나의 스마트폰 일기","pub":"서울: 판퍼블리싱, 2025","desc":"이미 스마트폰과 함께하는 세상이 익숙해진 아이들, 스마트폰을 처음 사용하려는 아이들과 부모가 함께 읽으면 도움이 될 실용적 지침서이다. 미디어 리터러시 강사인 저자가 스마트폰 사용의 장단점, 올바른 사용법 등을 안내하면서 스마트폰을 슬기롭게 사용하는 습관을 키우는 데 도움을 주는 내용을 담았다. 가독성 있는 구성으로 아이들이 글을 읽고 이해하기 쉽고, 실제 상황을 바탕으로 꾸며진 이야기들과 실질적인 도움 및 배움을 얻을 수 있는 삽화가 더해져 책을 읽는 재미를 더해줄 것이다."},{"title":"무량수전 배흘림기둥에 기대서서","pub":"서울: 학고재, 2023","desc":"한국의 미술은 언제나 담담하다. 그리고 욕심이 없어서 좋다. 없으면 없는 대로의 재료, 있으면 있는 대로의 솜씨가 꾸밈없이 드러난 것, 다채롭지도 수다스럽지도 않은, 그다지 슬플 것도 즐거울 것도 없는 덤덤한 매무새가 한국 미술의 마음씨다.'   제4대(1974 ~ 1984년) 국립중앙박물관 관장 혜곡 최순우. 한국의 건축, 도자, 회화, 공예, 불상에서 그의 안목으로 찾아낸 한국 미술의 정수가 담겨져 있는 책입니다. 온마음을 다해 만드는 장인의 손길과 눈길이, 그들이 만들어낸  아름다움을 곁에 두고 아끼며 다정하게 바라보았을 옛 누군가의 숨결이 계속해서 현재를 살고 있는 한국인들에게 까지 전해져 내려오고 있음을 책을 통해 다시 한 번 깨닫게 됩니다. 우리의 마음 속에 맥맥히 이어져 흐르는 ‘순리의 아름다움＇이란 이름으로."},{"title":"심장이 연주하는 우리 몸","pub":"서울: 스푼북, 2024","desc":"심장은 뇌의 명령에 따라 움직이지 않아요. 심장 근육은 스스로 알아서 움직이지요. 다른 근육들과 다른 점이에요.'   우리가 태어나기 전 가장 먼저 만들어지는 신체 기관인  심장이 우리 몸에서 어떤 역할을 하는지, 심장에서 따온 하트 모양이 어떻게 사랑을 상징하는 무늬로 사용하게 되었는지 등  심장을 주제로 과학 속, 역사 속, 문화 속 우리 생활 모든 것의 중심에 있는 심장에 대한 다채롭고 유익한  이야기를 만나볼 수 있는 지식그림책입니다.    '심장이 말하길 ??. '  여러분의 심장을 빠르게 뛰게 하는 것은 어떠한 것이 있나요? 우리 삶의 시작과 끝인 심장의 이야기에 귀를 기울여 보아요."},{"title":"가짜 결핍","pub":"서울: 부키, 2025","desc":"과거에 인류는 뇌가 보내는 ‘결핍 신호‘ 에 순응하여 끊임없이 생존을 위한 요소들을 갈구하였다. 산업혁명 이후 대부분의 요소(식량, 물건, 정보, 오락거리)를 충족할 수 있는 환경이 완성되었으나, 우리의 뇌는 아직도 무엇인가 부족하다는 신호를 보낸다. 자원의 과잉은 중독, 비만, 불안, 환경 파괴 등을 야기하여 오히려 우리를 불행하게 만든다. 이를 막기 위해서는 우리가 가진 ‘결핍의 뇌‘ 와 이로부터 생기는 ‘결핍의 고리‘ 에서 벗어나야 한다. 본능에 휘둘리는 대신 주도권을 갖고 오히려 활용하는 방법을 찾기 위하여 이 책을 펼쳐 보길 권한다."},{"title":"토마토로 만들어 줘","pub":"파주: 창비, 2025","desc":"미워하는 사람을 토마토로 만들 수 있는 주인공 도마윤은 같은 반 박은해에게 우연히 비밀을 들키게 된다. 충동적으로 은해를 토마토로 만드는 모습을 싫어하는 사람 1번인 유미도가 목격해 버리는데, 미도는 그 상황을 보고는 오히려 눈을 빛내며 과외 선생님을 토마토로 만들어 달라고 부탁한다.  토마토가 된 은해를 다시 사람으로 돌릴 수 있을까? 마윤은 미도의 부탁을 들어 줄까? 제일 싫어하는 미도를 토마토로 만들지 않으면서 자신의 비밀을 지킬 수 있을까?"},{"title":"아이가 친구 때문에 울 때","pub":"서울: 서교책방, 2025","desc":"처음은 모두 서툴다. 인간관계라고 다르지는 않다. 그러나  공부나 운동같은 분야와는 달리, 인간관계의 미숙함은 당연하게 여겨지지 않는것 같다. 그래서 사람들과의 관계에서 오는 문제는 더 큰 상처를 남긴다. 특히 아이들은 학교라는 사회  생활에 처음 부딪히며 많이 혼란스러울수밖에 없다.  이 책은 18년간 초등학교에서 아이들을 가르친 저자가 실제  사례들과 상담, 두아이를 키운 생생한 경험을 바탕으로  아이관계 고민에 현명하게 개입하는 법을 담은 책이다. 아이의 친구 문제로 고민이 많다면 이 책을 통해 저자와  이야기를 나눠보는것은 어떨까"},{"title":"여름에 내리는 비, 잠비","pub":"서울: 비룡소, 2025","desc":"1763년 여름에 만난 두소년의 이야기.  아버지를 끔찍하게 잃은 뜨겁고 아픈 기억을 품고 살아남아야 한다는 압박과 두려움에 잠을 이루지 못하는 왕세손  ‘이산’과 천한 얼자로 태어났어도 능청스러운 성격과  소리를 잘 듣는 귀로 역관을 꿈꾸는 ‘규안’의 만남을  담아냈다. 하늘과 땅처럼 서로 닿을 수 없는 거리에 있던 두 소년은 점차 서로의 처지를 들여다보게 되는데.. 시원한 잠비처럼 그들의 우정은 뜨겁게 메말랐던 그들의  마음에 한줄기 비가 될 수 있을까? 2025년 제4회 역사동화상 대상을 수상한 김도영의  『여름에 내리는 비, 잠비』. 그들의 이야기를 들어보자."},{"title":"어떤 어른","pub":"파주: 사계절, 2024","desc":"\"편의점 직원에게 예의 바르게 대하는 어른, 횡단보도를 건널 때 스마트폰을 보지 않는 어른, 뒷사람을 위해 문을 잡아주는 어른이 되어 주세요. 여러분이 어렸을 때 좋아했던 어른이 되어 주세요. 만일 그런 어른을 만난 적이 없다면, 여러분에게 필요했던 바로 그 어른이 되어주세요.”  어른이 된다는 것에 대하여 우리가 가야 할 길에 대해 말해줍니다.어린이는 자라서 어른이 되고, 어른은 자라서 더 나은 어른이 될 수 있습니다. 이 도서는 나는 어떤 어른이 되어야 할까라는 질문을 스스로 던지게 합니다."},{"title":"도시 해킹","pub":"고양: 책빛, 2024","desc":"\" 사람들은 신호를 찾으려 애를 썼어 하늘 높이높이 안테나도 세웠지 어떤 신호라도 잡으려고 말이야\" 만약에 정말 도시가 해킹된다면, 인터넷이 되지 않으면 어떤 일들이 일어날까요? 모두 같은 방향을 바라보았지만 가장 어린 한 아이가 방향을 바꿉니다. 인터넷이 없는 세상 속에서 다른 것을 해보기로 합니다. 할머니의 요리법도 배우고, 놀이터에서 놀기도 하면서 사람들은 각자의 방식으로 시간을 보냅니다.  이 도서를 통해 우리가 평소에 잊고 있던 소중한 것들에 대해 다시 생각해 보게 합니다."},{"title":"(나의 두 번째 교과서 ×) 나민애의 다시 만난 국어","pub":"서울: 페이지2북스,  2025","desc":"우리는 국어로 쓰인 텍스트를 통해 지식과 문명, 역사, 문학 등을 배우고 소통하며 살아간다. 국어 공부가 평생 공부가 되어야 하는 이유이다. 저자는 문해력, 어휘력 부족으로 어려움을 겪는 요즘 어른들을 위해 교과서 속 문학작품부터 시, 소설, 동화를 통해 찾는 독서의 쓸모, 현대인들에게 꼭 필요한 자기소개서, 서평, 메일 쓰기 등의 실용 글쓰기 노하우를 책 한 권에 담았다.  이 책은 국어와 친해지지 못한 어른들에게 훌륭한 길잡이 역할을 해줄 것이다."},{"title":"국경일에 숨은 우리나라 역사 이야기","pub":"파주: 다락원, 2025","desc":"이 책은 기억해야 할 우리나라 5대 국경일과 법정 기념일을 소개한다. 각 국경일과 기념일을 소개하기 전에 주제와 관련된 에피소드를 담아 흥미를 느낄 수 있게 구성했으며, 주제마다 중요한 역사적 사건을 이해하기 쉽게 설명하여 역사를 처음 배우는 어린이 독자들도 어렵지 않게 접근할 수 있다. 우리나라의 5대 국경일과 법정 기념일의 차이를 알고, 우리 역사에 한 걸음 더 다가가 보는 기회가 될 것이다."},{"title":"정호기","pub":"서울: 에이도스, 2015","desc":"1917년 11월 ~ 12월 일본의 사업가 야마모토 다다사부로 (山本唯三?1873 ~ 1927)가 조직한 정호군(征虎軍) 일행이 조선에서 벌인 한국 호랑이 사냥에 대한 수렵기입니다.  본인들이 사냥한 호랑이 박제를 앞에 두고 그 고기를 맛보는 호랑이 시식회장, 포획물 더미를 쌓아놓고 찍은 기념 사진 속 무력한 모습으로 끼어있는 한국인들의 얼굴이 무겁게 다가오지만 다행이 현재 러시아의 연해주에는 100년 전 한반도 호랑이와 한 혈통으로 보고 있는 야생 호랑이가 아직까지 살아남아 있다고 하니 작은 희망을 갖게 됩니다. 한국 호랑이가 전설 속의 동물로 사라지지 않도록 우리 모두가 복원과 보호에 더 많은 관심과 노력을 기울여야 할 것 같습니다."},{"title":"소년, 지구별을 보다","pub":"파주: 문학동네, 2024","desc":"‘나는 아무 걱정 없이 편안하게 숨 쉬고 싶어요.’  생명과 환경 그리고 인류의 미래에 대한 진지한 고찰을 갖고 지구를 어떻게 대해야 할지 고민해 보게하는 책입니다.     뉴질랜드의 아라나키 반도에 있는 휴화산 에그몬트(Egmont)산의 사진부터 바닥을 드러낸 케냐의 마가디(Magadi) 호수까지 한 걸음 멀리 떨어져서 바라본 지구의 경이로운 모습과 위기의 모습들이 교차하며 생물 다양성, 아동 권리 협약, 지속 가능한 개발등 우리가 함께 해결해야 할 문제들이 담겨있습니다. 한 모금이라도 더 맑고 시원한 물과 공기를 어린이들에게 남겨주고, 그들의 작은 어깨에 지워진 짐과 부담을 덜어주기 위한 작은 행동들을 지금부터 조금씩 실천해 보는 건 어떨까요?"},{"title":"행동은 불안을 이긴다","pub":"서울: 서삼독, 2025","desc":"불안은 누구나 느끼는 감정이다.  많은 사람들은 불안을 느낄 때 그 감정을 억누르거나 도망치려 하지만, 그것을 이기기 위한 핵심은 바로 '행동' 이다.  대단하고 거창한 '행동'이 아니라 매일 꾸준히 행하는 수많은 사소한 행동, 즉 '마이크로 액션'에서 비롯된다고 이 책은 강조한다. 매일 빠짐없이 실천하는 우리의  반복된 작은 행동들이 모여 결국 인생의 큰 변화들이 쌓여가는 것이라 믿으며, 불완전함 속에서도 불안과 함께 나아가는 용기와 꾸준한 실천이야말로 우리를 변화시키는 힘이 될 것이다."},{"title":"궁금했어, 태양계","pub":"서울: 나무생각, 2025","desc":"지구가 속한 드넓은 태양계, 그 너머로 이어지는 우주의 아름다움과 신비로움!  태양계의 탄생 과정과 생김새도 특성도 제각각인 태양계 내에 있는 여러 천체들의 이야기를 담은 아동 과학 도서로,  다양한 행성들과 소행성, 위성과 우주 탐사에 대한 내용까지 이 책에 모두 담고 있다. 태양계와 우주에 관한 과학적 지식뿐만 아니라 역사적 개념을 더해 인문학적 지식까지 함께 배울 수 있고 아이들의 호기심을 유발하는 내용들로 구성하여 우주와 과학에 대한 자연스러운 흥미와 관심을 유도한다."},{"title":"적절한 좌절","pub":"서울: 저녁달, 2025","desc":"영양 부족이 심하던 예전, 부모들은 누구나 자식을 우량아 선발 대회 우승자처럼 포동포동하게 키우고 싶어했다. 하지만 식량이 풍족한 요즘은 오히려 영양 과잉을 걱정하는 시대이다.  이처럼 자식에게 주는 정서적 영양도 너무 지나치면 ‘정서적 비만‘을 초래할 수 있으며, 아이들이 자율성과 독립성을 기르지 못하게 막는다.  감정 조절과 문제 해결 능력을 키우기 위해서는 ‘적절한 좌절’ 이 있어야만 한다. 이 책은 아이를 키우는 부모님과 좌절을 겪지 못했던 어른을 위해 ‘적절한 좌절‘ 방법을 알려준다."},{"title":"비스킷.2","pub":"서울: 위즈덤하우스, 2025","desc":"자신을 지키는 힘을 잃은 비스킷을 구하기 위한 여정이 두번째 이야기로 돌아왔다!  전편에서 비스킷을 구하는 장면이 세상에 알려지면서 세상 사람들은 비스킷을 이해하기보다는 호기심의 대상으로 대한다. 그 속에서도 주인공 제성과 친구들은 다양한 비스킷들을 구하기 위해 분주한다.  <비스킷 2>는 또래 집단의 은근한 소외와 이주 가정 자녀, 딥페이크 등 다양한 사회이슈를 판타지 소재로 엮어내, 남녀노소 독자들이 흥미로운 이야기 속에서도 주변사람들을 이해한다는 것의 힘을 한 번씩 깊이 생각하게 해준다."},{"title":"부모의 태도가 아이의 불안이 되지 않게","pub":"서울: 부키, 2025","desc":"아이의 마음은 투명하고 작은 연못과 같다. 부모의 눈에 사소하게만 보이는 일들도 아이의 마음에 큰 파동을 일으키기에 충분한 일이 되기도 한다.   아동 가족심리치료사인 저자들은 불안이라는 감정을 마주하고 조절할 수 있는 실용적이고 구체적인 방법을 제시하고 있다.  또한 불안한 아이를 양육하는 부모들의 생생한 사례를 통해 마치 실제 부모 코칭 현장에 있는 것처럼 공감을 불러일으키며 아이의 마음을 돌보는 것에서 더 나아가 부모자신의 마음까지 돌볼 수 있는 기회를 선사할 것이다."},{"title":"게임왕","pub":"서울: 문학과지성사, 2021","desc":"공부는 못하지만 게임만큼은 자신 있는 민오. 게임 속에서 만큼은 민오가 유일하게 인정받고 추앙 받을 수 있다. 그곳에서는 누구도 민오를 얕잡아 보지 않고 오히려 민오의 실력에 감탄하며 게임왕이라는 별명을 붙여 우러러 보기까지 한다. 그럴수록 민오는 더욱더 게임에 몰입한다.  게임에 점점 중독되어가는 민오는 엄마에 의해 게임중독 치료캠프에 가게되지만 그곳에는 현실세계와 가상세계가 구분되지 않는 서바이벌 게임이 기다리고 있는데.. 과연 민오는 게임 세계에서 살아남아 안전하게 현실로 돌아올 수 있을까?"},{"title":"보편의 단어","pub":"서울: 말글터, 2024","desc":"\"평범하게 살고 싶다\" \"불행의 반대는 행복이 아니라 일상에 가깝다.“ 우리는 남보다 뒤처지지 않겠다, 남들처럼 살고 싶다는 의지가 있는지도 모릅니다. 아무일 없음이 얼마나 감사한 일인가요. 무의미한 단어는 없습니다.우리가 자주 읽고 쓰고 떠올리는 모든 단어엔 각자의 삶이 투영돼 있습니다. 각 단락별로의 단어의 의미는 삶을 새로운 관점으로 바라보게 해줍니다. 가끔 '쉼'이 필요할 때 이 책을 읽어보는 건 어떨까요?"},{"title":"꾀병 사용법","pub":"서울: 길벗어린이, 2025","desc":"\"살다보면 힘든 날이 있잖아 오늘이 바로 그런 날이야.' 안 좋은 일이 꼬리에 꼬리를 무는 날... 여러분은 아프고 싶은 기분일 때 어떻게 하나요? 지각하고, 혼나고, 실수하고 하루 종일 되는 일 하나 없을 날 아이는 꾀병이 필요합니다. 그래서 엄마에게 아프다고 하니 엄마도 믿어줍니다. 그리고 친구와도 화해를 하면서 마음이 풀어집니다. 정말 힘들 땐 아주 가끔 사용해야 효과 만점인 꾀병사용법을 읽어보세요!"},{"title":"대한민국 구석구석 무장애 여행","pub":"서울: 나무발전소, 2024","desc":"이 책의 저자는 휠체어 여행가이다. 시중에 다양한 여행서적이 있지만 장애 당사자의 시선으로 여행지를 관찰한 책은 드물다. 이 책은 휠체어를 탄 장애인 뿐만 아니라 유아차를 탄 아기, 무릎이 아픈 어르신 등 ‘접근성’과 ‘다양성’이 요구되는 관광 약자에게 최적의 여행 코스를 안내한다. 이 책은 휠체어를 탄 당사자 뿐만 아니라 휠체어 여행을 함께할 동행자에게도 설렘을 준다."},{"title":"내가 만드는 사전","pub":"서울: 주니어마리, 2024","desc":"이 책은 사전 편찬자인 엄마와 아홉 살 딸이 엮은 43개의 단어 사전이다. 책의 제목처럼 어린이 시선에서 다룬 사전 뜻풀이와 실제 국어사전의 뜻풀이가 함께 실려 있다. 어린이 독자들은 책에 실려 있는 낱말이나 자신이 좋아하는 낱말들을 찾아 반짝반짝 빛나는 나만의 사전을 만들어 보는 재미를 느낄 수 있다. 책 속의 주인공 다람이와 함께 세상의 말들에 새로운 생명을 불어넣으며, 가족의 소중함도 느낄 수 있다."},{"title":"백남준","pub":"파주: 아르테, 2020","desc":"＂기왕이면 지워지지 않는 유성펜으로 그리라\"  ＂왜? 팔려고? 이 그림은 지워질 때까지 보는 거야. 원래 예술품은 그때 즐거워야하는 거지. 내일이면 시시해져.”  예술가 백남준(1932 ~ 2006)이 걸어온 발자취를 따라 그의 삶과 작품세계를 따라가 봅니다. 금수저 부잣집 도련님에서 배고픈 뉴욕 예술가의 삶까지, ??굿??과 같은 한국 전통문화에서 세계를 깜짝 놀라게 하는 전위예술까지, 동양사상의 바탕 위에 세워진 서양사상의 거대한 기둥들? 그의 삶은 언제나 새로운 세상이라는 거친 파도에 요동치지만 그의 내면에 있는 ‘자유의지＇라는 절대 흔들리지 않는 열정이 중심을 잘 잡아 주었던 것 같습니다. 그가 남긴 소중한 유산인 강인한 자유의지와 불굴의 개척정신을 다시 새겨 보길 바랍니다."},{"title":"(세계를 바꾸는)착한 특허 이야기","pub":"서울: 북멘트, 2020","desc":"특허를 포기한 과학자들?! 눈앞의 이해득실을 떠나 장기적인 안목으로 공동체 모두의 행복을 위해 개인의 이익과 권리를 과감히 포기한 위대한 과학자들을 만나봅니다.   모두가 정보를 공유하는 세상, 돈이 없다는 이유로 치료를 포기하는 사람이 없는 세상, 생명 대신 이익이 우선시 되어서는 안된다는 기업 철학이 당연하게 받아들여지는 세상, 우리가 현재 자연스럽게 누리고 있는 이 모든 가치와 혜택들은 값어치를 매길 수 없는 그들의 노력과 결심이 있기에 가능한 것들입니다. 과학자들의 생생한 실화를 바탕으로 한 이야기들을  따라 그들이 가리키는 과학의 방향성과 미래, 인류애와의 관계등을 연결지어 생각해보면 좋을 것 같습니다."},{"title":"나무들의 비밀스러운 생활","pub":"서울: 더숲, 2025","desc":"2015년 독일에서 출간된 이래 40여 개 언어로 번역된 세계적 베스트셀러 『나무들의 비밀스러운 생활』을 그래픽노블로 다시 출간한 책이다. 저자는 숲과 나무를 비롯한 다양한 생명체들에 대한 이야기와 아름답고 경이로운 자연의 세계로 우리를 안내한다.  숲은, 복잡하지만 섬세한 생명공동체이자 하나의 거대한 사회라는 메시지와 함께, 다채로운 색감과 독창적인 그래픽 또한 다소 어려울 수 있는 생태학적 개념이나 과학적 설명들을 보다 쉽고 재미있게 이해할 수 있도록 도울 것이다."},{"title":"별별 직업 상담소","pub":"파주: 주니어김영사, 2025","desc":"지구에 불시착한 외계인이 지구 정착을 위한 직업을 구하기 위해 ＇별별 직업 상담소’를 찾으면서 시작하는 이야기이다. 외계인은, 일이라는 것이 무엇인지 탐색해가며 지구에 있는 다양한 직업들에 대해 점차 알아간다. 이런 직업이 있으면 좋겠다는 생각이 드는 기발하고 특이한 직업들이 흥미로우면서, 현재를 살아가며 미래를 고민하는 우리들이 읽어봄직한 책이라는 생각이 들게 한다. 아이들에게는 진로 탐색의 시작점이 되어주고, 어른에게는 일과 삶에 대해 성찰하게 하는 작은 쉼표같은 책이 되어줄 것이다."}],"keywords":[{"rank":1,"kw":"흔한남매","count":5339},{"rank":2,"kw":"혼모노","count":4858},{"rank":3,"kw":"javascript","count":2805},{"rank":4,"kw":"절창","count":2656},{"rank":5,"kw":"모순","count":1737},{"rank":6,"kw":"삼국지","count":1647},{"rank":7,"kw":"괴테는 모든 것을 말했다","count":1498},{"rank":8,"kw":"안녕이라 그랬어","count":1476},{"rank":9,"kw":"급류","count":1378},{"rank":10,"kw":"박곰희","count":1244},{"rank":11,"kw":"해리포터","count":1047},{"rank":12,"kw":"긴긴밤","count":1027},{"rank":13,"kw":"하우 const C = {"공연":["#7C3AED","#A78BFA"],"전시":["#0891B2","#22D3EE"],"강좌":["#0A7373","#34D399"],"체험":["#D97706","#FBBF24"],"북토크":["#BE185D","#F472B6"],"행사":["#475569","#94A3B8"]};
let TAB='events', HOST='전체', AGE='전체';
const scls = (s)=> s==='마감'?'closed':s==='진행중'?'ing':'open';
const rng = (a,b)=> a? (b&&b!==a? a+' ~ '+b : a) : '-';

function poster(e){
  return `<a class="card ${e.status==='마감'?'dim':''}" href="${e.applyUrl}" target="_blank">
    <div class="poster">
      ${e.poster?`<img class="pimg" src="${e.poster}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}
      <span class="pstatus ${scls(e.status)}">${e.status}</span>
      <span class="pcat">${e.cat}</span>
    </div>
    <div class="cname">${e.title}</div>
    <div class="cmeta">${rng(e.start,e.end)}<br>${e.venue||''}${e.target?' / '+e.target:''}</div>
  </a>`;
}
function row(e){
  const closed=e.status==='마감';
  return `<tr>
    <td><span class="tcat">${e.cat}</span></td>
    <td class="tname">${e.title}</td>
    <td>${e.capacity||'-'}</td>
    <td>${rng(e.applyStart,e.applyEnd)}</td>
    <td>${rng(e.start,e.end)}</td>
    <td>${e.venue||'-'}</td>
    <td>${e.target||'전체'}</td>
    <td><span class="tstatus ${scls(e.status)}">${e.status}</span></td>
    <td><a class="tbtn ${closed?'off':''}" href="${e.applyUrl}" target="_blank">${closed?'마감':'신청'}</a></td>
  </tr>`;
}
function renderHosts(base){
  const cnt={}; base.forEach(e=>cnt[e.host]=(cnt[e.host]||0)+1);
  const chips=[['전체',base.length],...Object.entries(cnt).sort((a,b)=>b[1]-a[1])];
  document.getElementById('hostbar').innerHTML='<span class="flbl">주관</span>'+chips.map(([h,n])=>`<span class="h ${HOST===h?'on':''}" onclick="setHost('${h}')">${h}<b>${n}</b></span>`).join('');
}
function renderAges(base){
  const cnt={}; base.forEach(e=>(e.ages||[]).forEach(a=>cnt[a]=(cnt[a]||0)+1));
  const order=(D.ageOrder||[]).filter(a=>cnt[a]);
  const chips=[['전체',base.length],...order.map(a=>[a,cnt[a]])];
  document.getElementById('agebar').innerHTML='<span class="flbl">대상연령</span>'+chips.map(([h,n])=>`<span class="h ${AGE===h?'on':''}" onclick="setAge('${h}')">${h}<b>${n}</b></span>`).join('');
}
window.setHost=(h)=>{HOST=h;render();};
window.setAge=(a)=>{AGE=a;render();};
function render(){
  const q=(document.getElementById('q').value||'').trim();
  let from=document.getElementById('from').value, to=document.getElementById('to').value;
  if(from&&to&&from>to){const t=from;from=to;to=t;}  // 거꾸로 입력 자동 교정
  const base=D.events;
  renderHosts(base); renderAges(base);
  const list=base.filter(e=>{
    if(HOST!=='전체'&&e.host!==HOST) return false;
    if(AGE!=='전체'&&!(e.ages||[]).includes(AGE)) return false;
    if(q&&!e.title.includes(q)&&!(e.venue||'').includes(q)) return false;
    if(from&&(e.end||e.start)<from) return false;   // 기간 겹침
    if(to&&e.start>to) return false;
    return true;
  });
  const posters=list.filter(e=>e.poster), rows=list.filter(e=>!e.poster);
  document.getElementById('cnt').textContent=list.length;
  document.getElementById('grid').innerHTML=posters.slice(0,40).map(poster).join('') || '<div style="color:#94A3B8;padding:10px 0">해당 포스터 행사가 없습니다.</div>';
  document.getElementById('tbody').innerHTML=rows.slice(0,150).map(row).join('');
  document.getElementById('pcnt').textContent=posters.length+'건';
  document.getElementById('tcnt').textContent=rows.length+'건 (최대 150건 표시)';
  document.getElementById('postersec').classList.toggle('hidden',posters.length===0);
  document.getElementById('tablesec').classList.toggle('hidden',rows.length===0);
  document.getElementById('srcrow').innerHTML=
    '<span class="sp">공공데이터포털 · 군포 도서관 문화행사<b>'+D.meta.libCount+'</b></span>'+
    '<span class="op">⊕</span>'+
    '<span class="sp">그림책꿈마루(스크래핑·포스터)<b>'+D.meta.picCount+'</b></span>'+
    '<span class="op">=</span>'+
    '<span class="eq">통합 '+(D.meta.libCount+D.meta.picCount)+'건</span>'+
    '<span class="note">기준일 '+D.demoNow+' · 공공데이터 스냅샷</span>';
}
function renderBooks(){
  document.getElementById('bcnt').textContent=D.books.length+'권';
  document.getElementById('bookwrap').innerHTML=D.books.slice(0,40).map(b=>
    `<div class="book"><div class="bspine">책</div><div><div class="bt">${b.title}</div><div class="bp">${b.pub||''}</div><div class="bd">${b.desc||''}</div></div></div>`).join('');
}
function renderKw(){
  document.getElementById('kwwrap').innerHTML=D.keywords.map(k=>`<span class="k"><b>${k.rank}</b>${k.kw}<i>${(k.count||0).toLocaleString('ko-KR')}회</i></span>`).join('');
}
function setTab(t){
  TAB=t;
  document.querySelectorAll('.gnb nav a').forEach(a=>a.classList.toggle('on',a.dataset.tab===t));
  document.getElementById('view-events').classList.toggle('hidden',t!=='events');
  document.getElementById('view-books').classList.toggle('hidden',t!=='books');
  document.getElementById('view-kw').classList.toggle('hidden',t!=='kw');
  if(t==='events')render(); else if(t==='books')renderBooks(); else renderKw();
}
document.querySelectorAll('.gnb nav a').forEach(a=>a.onclick=(e)=>{e.preventDefault();setTab(a.dataset.tab);});
document.getElementById('q').addEventListener('input',()=>{if(TAB==='events')render();});
document.getElementById('foot').textContent='출처: 공공데이터포털 경기도 군포시 도서관 문화행사·추천도서·인기검색어 + 그림책꿈마루 실시간 스크래핑(포스터·신청링크) · LIVE '+(D.meta.fetchedAt||'').slice(0,10)+' · 핏치 통합';
render();
</script>
