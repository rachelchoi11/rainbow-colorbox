<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:2000px; height:2000px; overflow:hidden; }
  body { background:#F6F3EF; font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",Pretendard,sans-serif;
         -webkit-print-color-adjust:exact; display:flex; flex-direction:column; }
  /* 상단 구역: 시안소식 (라인 위, 상하좌우 가운데) */

  .news { font-size:118px; font-weight:600; letter-spacing:12px; color:#3a3630; }
  /* 전체폭 주황 라인 (1.5배 두께) */
  .rule { width:2000px; height:6px; background:#E0872A; }
  /* 본문 구역: 남은 공간 상하좌우 가운데 */
  .main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
          text-align:center; padding:0 150px; }
  .hero { font-size:196px; font-weight:800; letter-spacing:-3px; color:#2b2721; line-height:1.15; }
  .body { margin-top:170px; font-size:74px; font-weight:400; color:#6a6157; line-height:1.8; }
  .info { margin-top:150px; font-size:72px; font-weight:500; color:#3a342d; line-height:1.85; text-align:left; }
  .info b { font-weight:700; color:#2b2721; }
</style></head><body>
  <div class="top"><div class="news">시안소식</div></div>
  <div class="rule"></div>
  <div class="main">
    <div class="hero">근무 시간 연장 운영</div>
    <div class="body">혹서기 기간 동안 고객분들의<br>편의를 위해 근무 시간을<br>1시간 연장하여 운영합니다.</div>
    <div class="info">- 근무 시간 : 오전 8시 ~ 오후 6시<br>- 분양 문의 : <b>1577-5080</b></div>
  </div>
</body></html>
