<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>정산 솔루션 — 서비스 영역 화면 목업 (v1.0)</title>
<style>
  /* Zoom-inspired global SaaS design system */
  :root{
    --blue:#0B5CFF; --blue-d:#0847CC; --blue-l:#E8F0FF; --blue-l2:#F2F7FF;
    --ink:#131619; --ink2:#3B424B; --muted:#6E7680;
    --line:#E7EAF1; --bg:#F5F8FD; --ok:#12805C; --ok-l:#E4F5EE; --warn:#B0740F; --warn-l:#FBF1DF;
    --sh:0 1px 2px rgba(19,32,64,.05),0 2px 8px rgba(19,32,64,.05); --sh-lg:0 6px 24px rgba(19,32,64,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter","Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  /* topbar — 화이트 헤더 */
  .top{height:60px;background:#fff;color:var(--ink);display:flex;align-items:center;padding:0 26px;gap:14px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
  .top .logo{font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--ink)}
  .top .logo b{color:var(--blue)}
  .top .env{font-size:11px;color:var(--blue);background:var(--blue-l);border:none;border-radius:20px;padding:4px 11px;font-weight:600}
  .top .sp{flex:1}
  .top .role{display:flex;gap:8px;align-items:center;color:var(--muted)}
  .top select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;box-shadow:var(--sh)}
  .top .user{font-size:12px;color:var(--muted);background:var(--bg);padding:6px 12px;border-radius:20px}
  /* layout */
  .wrap{display:flex;min-height:calc(100vh - 60px)}
  .side{width:222px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;flex-shrink:0}
  .side .grp{font-size:11px;color:var(--muted);padding:10px 12px 8px;letter-spacing:.02em;font-weight:600}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--ink2);cursor:pointer;font-size:13px;border-radius:10px;margin-bottom:2px;transition:all .12s}
  .side a:hover{background:var(--blue-l2)}
  .side a.on{background:var(--blue-l);color:var(--blue);font-weight:700}
  .side .ic{width:18px;text-align:center;opacity:.9}
  .main{flex:1;padding:28px 34px;overflow:auto}
  h1{font-size:23px;color:var(--ink);margin-bottom:4px;letter-spacing:-.02em;font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  /* cards */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--sh)}
  .card .k{font-size:12px;color:var(--muted);font-weight:500}
  .card .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:6px;letter-spacing:-.02em}
  .card .d{font-size:11.5px;margin-top:4px}
  .up{color:var(--ok)} .dn{color:#C2362F}
  /* panel */
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
  .panel h2{font-size:15px;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:9px;font-weight:700}
  .panel h2 .tag{font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-l);border:none;border-radius:20px;padding:3px 10px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--muted);font-weight:600;background:transparent;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
  td{padding:11px 12px;border-bottom:1px solid #F0F2F7;vertical-align:middle}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--blue-l2)}
  .pill{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;display:inline-block}
  .p-ok{background:var(--ok-l);color:var(--ok)} .p-warn{background:var(--warn-l);color:var(--warn)} .p-mut{background:#EEF1F6;color:var(--muted)} .p-navy{background:var(--blue-l);color:var(--blue)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(11,92,255,.25);transition:all .12s}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid #C5D6FF;box-shadow:none}
  .btn.gold{background:var(--ink);color:#fff;box-shadow:none}
  .row{display:flex;gap:16px} .row>*{flex:1}
  /* dropzone */
  .drop{border:2px dashed #C5D2E6;border-radius:16px;padding:34px;text-align:center;color:var(--muted);background:var(--blue-l2)}
  .drop b{color:var(--blue)}
  .sel{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;min-width:160px;background:#fff}
  /* steps */
  .steps{display:flex;gap:0;margin:10px 0 6px}
  .step{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:26px}
  .step:before{content:"";position:absolute;top:7px;left:50%;width:100%;height:2px;background:var(--line)}
  .step:first-child:before{display:none}
  .step .dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--line)}
  .step.done{color:var(--blue)} .step.done .dot{background:var(--blue);border-color:var(--blue)} .step.done:before{background:var(--blue)}
  .step.cur{color:var(--blue);font-weight:800} .step.cur .dot{background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-l)}
  .screen{display:none} .screen.on{display:block}
  .note{font-size:11.5px;color:var(--muted);margin-top:10px}
  .stmt{max-width:580px;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-lg)}
  .stmt .hd{background:linear-gradient(135deg,#0B5CFF,#2D8CFF);color:#fff;padding:18px 20px}
  .stmt .hd .t{font-weight:800;font-size:15px} .stmt .hd .s{font-size:11.5px;color:#D6E4FF;margin-top:2px}
  .stmt .bd{padding:18px 20px}
  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .kv.total{border-bottom:none;font-weight:800;color:var(--blue);font-size:16px;padding-top:12px}
  .mockbadge{position:fixed;right:16px;bottom:16px;background:var(--ink);color:#fff;font-size:11px;padding:8px 14px;border-radius:20px;opacity:.9;box-shadow:var(--sh-lg)}
</style>
</head>
