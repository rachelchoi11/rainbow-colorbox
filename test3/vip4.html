<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>병원 면회 예약 시스템</title>
    <!-- Bootstrap CSS 링크 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Flatpickr CSS 링크 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Flatpickr 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- Flatpickr 한국어 로케일 -->
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    <!-- SheetJS 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <style>
        .time-slot {
            cursor: pointer;
        }
        .time-slot.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .date-selector {
            margin-bottom: 20px;
        }
        .nav-tabs .nav-link {
            cursor: pointer;
        }
        .edit-mode .reservation-checkbox {
            display: inline-block !important;
        }
        .reservation-checkbox {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">병원 면회 예약 시스템</h1>
        
        <!-- 날짜 선택 -->
        <div class="mb-3">
            <label for="visitDateRange" class="form-label">면회 기간 선택 (일)</label>
            <input type="number" class="form-control" id="visitDateRange" min="1" max="30" value="7">
            <button class="btn btn-primary mt-2" id="applyDateRange">적용</button>
        </div>

        <!-- 병동/호실 정보 업로드 -->
        <div class="mb-3">
            <label for="wardRoomUpload" class="form-label">병동/호실 정보 업로드</label>
            <input type="file" class="form-control" id="wardRoomUpload" accept=".xlsx, .xls">
            <button class="btn btn-primary mt-2" id="applyWardRoom">적용</button>
        </div>

        <!-- 날짜별 시간 슬롯 -->
        <ul class="nav nav-tabs" id="dateTabs"></ul>
        <div class="tab-content" id="dateSlots"></div>

        <!-- 예약 모달 -->
        <div class="modal fade" id="reservationModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">면회 예약</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="reservationForm">
                            <div class="mb-3">
                                <label for="ward" class="form-label">병동</label>
                                <select class="form-select" id="ward" required></select>
                            </div>
                            <div class="mb-3">
                                <label for="room" class="form-label">호실</label>
                                <select class="form-select" id="room" required></select>
                            </div>
                            <div class="mb-3">
                                <label for="patientName" class="form-label">환자명</label>
                                <select class="form-select" id="patientName" required></select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-primary" id="confirmReservation">예약</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 예약 목록 -->
        <div class="mt-5">
            <h2>예약 목록</h2>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <button class="btn btn-primary" id="editReservations">편집</button>
                    <button class="btn btn-danger d-none" id="deleteSelected">선택 삭제</button>
                </div>
                <div class="form-check d-none" id="selectAllContainer">
                    <input class="form-check-input" type="checkbox" id="selectAll">
                    <label class="form-check-label" for="selectAll">전체 선택</label>
                </div>
            </div>
            <ul id="reservationList" class="list-group"></ul>
        </div>

        <!-- 예약 내역 다운로드 버튼 -->
        <button class="btn btn-success mt-3" id="downloadReservations">예약 내역 다운로드</button>

        <!-- 초기화 버튼 -->
        <button class="btn btn-warning mt-3 me-3" id="resetButton">초기상태로 리셋</button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const visitDateRangeInput = document.getElementById('visitDateRange');
            const applyDateRangeBtn = document.getElementById('applyDateRange');
            const dateSlotsContainer = document.getElementById('dateSlots');
            const dateTabsContainer = document.getElementById('dateTabs');
            const reservationModal = new bootstrap.Modal(document.getElementById('reservationModal'));
            const reservationForm = document.getElementById('reservationForm');
            const confirmReservationBtn = document.getElementById('confirmReservation');
            const reservationList = document.getElementById('reservationList');
            const wardRoomUpload = document.getElementById('wardRoomUpload');
            const applyWardRoomBtn = document.getElementById('applyWardRoom');
            const downloadReservationsBtn = document.getElementById('downloadReservations');
            const resetButton = document.getElementById('resetButton');
            const editReservationsBtn = document.getElementById('editReservations');
            const deleteSelectedBtn = document.getElementById('deleteSelected');
            const selectAllCheckbox = document.getElementById('selectAll');
            const selectAllContainer = document.getElementById('selectAllContainer');
            let selectedDateTime = '';
            let wardRoomData = {};
            let patientData = {};
            let reservations = [];
            let timeSlotStatus = {};
            let isEditMode = false;

            // 로컬 스토리지에서 데이터 불러오기
            function loadFromLocalStorage() {
                const savedWardRoomData = localStorage.getItem('wardRoomData');
                const savedPatientData = localStorage.getItem('patientData');
                const savedReservations = localStorage.getItem('reservations');
                const savedTimeSlotStatus = localStorage.getItem('timeSlotStatus');

                if (savedWardRoomData) {
                    wardRoomData = JSON.parse(savedWardRoomData);
                    updateWardSelect();
                }
                if (savedPatientData) {
                    patientData = JSON.parse(savedPatientData);
                }
                if (savedReservations) {
                    reservations = JSON.parse(savedReservations);
                    updateReservationList();
                }
                if (savedTimeSlotStatus) {
                    timeSlotStatus = JSON.parse(savedTimeSlotStatus);
                }
            }

            // 로컬 스토리지에 데이터 저장하기
            function saveToLocalStorage() {
                localStorage.setItem('wardRoomData', JSON.stringify(wardRoomData));
                localStorage.setItem('patientData', JSON.stringify(patientData));
                localStorage.setItem('reservations', JSON.stringify(reservations));
                localStorage.setItem('timeSlotStatus', JSON.stringify(timeSlotStatus));
            }

            // 페이지 로드 시 저장된 데이터 불러오기
            loadFromLocalStorage();

            // 날짜 범위 적용 버튼 클릭 시 시간 슬롯 업데이트
            applyDateRangeBtn.addEventListener('click', updateDateSlots);

            // 날짜별 시간 슬롯 업데이트
            function updateDateSlots() {
                const days = parseInt(visitDateRangeInput.value);
                dateTabsContainer.innerHTML = '';
                dateSlotsContainer.innerHTML = '';

                for (let i = 0; i < days; i++) {
                    const date = new Date();
                    date.setDate(date.getDate() + i);
                    const dateStr = date.toISOString().split('T')[0];

                    // 탭 생성
                    const tabItem = document.createElement('li');
                    tabItem.className = 'nav-item';
                    tabItem.innerHTML = `
                        <a class="nav-link ${i === 0 ? 'active' : ''}" id="tab-${dateStr}" data-bs-toggle="tab" href="#content-${dateStr}" role="tab">
                            ${dateStr}
                        </a>
                    `;
                    dateTabsContainer.appendChild(tabItem);

                    // 탭 내용 생성
                    const tabContent = document.createElement('div');
                    tabContent.className = `tab-pane fade ${i === 0 ? 'show active' : ''}`;
                    tabContent.id = `content-${dateStr}`;
                    tabContent.innerHTML = `
                        <table class="table table-bordered mt-3">
                            <thead>
                                <tr>
                                    <th>시간</th>
                                    <th>상태</th>
                                    <th>예약</th>
                                    <th>특이사항</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${generateTimeSlots(dateStr)}
                            </tbody>
                        </table>
                    `;
                    dateSlotsContainer.appendChild(tabContent);
                }

                // 시간 슬롯 버튼에 이벤트 리스너 추가
                document.querySelectorAll('.time-slot').forEach(button => {
                    button.addEventListener('click', function() {
                        selectedDateTime = this.dataset.datetime;
                        reservationModal.show();
                    });
                });

                // 스위치에 이벤트 리스너 추가
                document.querySelectorAll('.form-check-input').forEach(switchEl => {
                    switchEl.addEventListener('change', function() {
                        const timeSlotBtn = this.closest('tr').querySelector('.time-slot');
                        const dateTime = timeSlotBtn.dataset.datetime;
                        const noteCell = this.closest('tr').querySelector('.time-slot-note');
                        const label = this.nextElementSibling; // 라벨 요소

                        if (!this.checked) {
                            const reason = prompt('면회 불가 사유를 입력해주세요:');
                            if (reason !== null) {
                                timeSlotStatus[dateTime] = { available: false, note: reason };
                                noteCell.textContent = reason;
                                label.textContent = '불가'; // 라벨 업데이트
                            } else {
                                this.checked = true;
                                return;
                            }
                        } else {
                            delete timeSlotStatus[dateTime];
                            noteCell.textContent = '';
                            label.textContent = '가능'; // 라벨 업데이트
                        }

                        timeSlotBtn.classList.toggle('disabled', !this.checked);
                        timeSlotBtn.textContent = this.checked ? '예약' : '불가';
                        saveToLocalStorage();
                    });
                });
            }

            // 시간 슬롯 HTML 생성
            function generateTimeSlots(date) {
                let slotsHtml = '';
                for (let hour = 11; hour <= 17; hour++) {
                    for (let minute of ['00', '30']) {
                        if (hour === 17 && minute === '30') continue; // 17:30 제외
                        const time = `${hour.toString().padStart(2, '0')}:${minute}`;
                        const dateTime = `${date} ${time}`;
                        let status = timeSlotStatus[dateTime] || { available: true, note: '' };
                        
                        // 12시, 12:30, 13시는 디폴트로 불가이지만 수정 가능
                        if (hour === 12 || (hour === 13 && minute === '00')) {
                            status = timeSlotStatus[dateTime] || { available: false, note: '점심시간' };
                        }
                        
                        slotsHtml += `
                            <tr>
                                <td>${time}</td>
                                <td>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="switch${date}${time.replace(':', '')}" ${status.available ? 'checked' : ''}>
                                        <label class="form-check-label" for="switch${date}${time.replace(':', '')}" id="label${date}${time.replace(':', '')}">${status.available ? '가능' : '불가'}</label>
                                    </div>
                                </td>
                                <td>
                                    <button class="btn btn-primary btn-sm time-slot ${status.available ? '' : 'disabled'}" data-datetime="${dateTime}">${status.available ? '예약' : '불가'}</button>
                                </td>
                                <td class="time-slot-note">${status.note}</td>
                            </tr>
                        `;
                    }
                }
                return slotsHtml;
            }

            // 병동/호실/환자 정보 업로드
            applyWardRoomBtn.addEventListener('click', function() {
                const file = wardRoomUpload.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet);
                        
                        wardRoomData = {};
                        patientData = {};
                        jsonData.forEach(item => {
                            if (item.ward && item.room) {
                                if (!wardRoomData[item.ward]) {
                                    wardRoomData[item.ward] = [];
                                }
                                if (!wardRoomData[item.ward].includes(item.room)) {
                                    wardRoomData[item.ward].push(item.room);
                                }
                                if (item.patientName) {
                                    if (!patientData[item.ward]) {
                                        patientData[item.ward] = {};
                                    }
                                    if (!patientData[item.ward][item.room]) {
                                        patientData[item.ward][item.room] = [];
                                    }
                                    if (!patientData[item.ward][item.room].includes(item.patientName)) {
                                        patientData[item.ward][item.room].push(item.patientName);
                                    }
                                }
                            }
                        });

                        updateWardSelect();
                        saveToLocalStorage();
                        alert('병동/호실/환자 정보가 성공적으로 적용되었습니다.');
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    alert('먼저 엑셀 파일을 선택해주세요.');
                }
            });

            // 병동 선택 업데이트
            function updateWardSelect() {
                const wardSelect = document.getElementById('ward');
                wardSelect.innerHTML = '<option value="">선택하세요</option>';
                Object.keys(wardRoomData).forEach(ward => {
                    wardSelect.innerHTML += `<option value="${ward}">${ward}</option>`;
                });
            }

            // 병동 선택 시 호실 업데이트
            document.getElementById('ward').addEventListener('change', function() {
                const roomSelect = document.getElementById('room');
                const patientSelect = document.getElementById('patientName');
                roomSelect.innerHTML = '<option value="">선택하세요</option>';
                patientSelect.innerHTML = '<option value="">선택하세요</option>';
                if (this.value && wardRoomData[this.value]) {
                    wardRoomData[this.value].forEach(room => {
                        roomSelect.innerHTML += `<option value="${room}">${room}</option>`;
                    });
                }
            });

            // 호실 선택 시 환자 업데이트
            document.getElementById('room').addEventListener('change', function() {
                const ward = document.getElementById('ward').value;
                const patientSelect = document.getElementById('patientName');
                patientSelect.innerHTML = '<option value="">선택하세요</option>';
                if (ward && this.value && patientData[ward] && patientData[ward][this.value]) {
                    patientData[ward][this.value].forEach(patient => {
                        patientSelect.innerHTML += `<option value="${patient}">${patient}</option>`;
                    });
                }
            });

            // 예약 추가
            function addReservation(reservation) {
                reservations.push(reservation);
                updateReservationList();
                saveToLocalStorage();
            }

            // 예약 삭제
            function deleteReservation(index) {
                if (confirm('이 예약을 삭제하시겠습니까?')) {
                    reservations.splice(index, 1);
                    saveToLocalStorage();
                    updateReservationList();
                }
            }

            // 예약 목록 업데이트
            function updateReservationList() {
                reservationList.innerHTML = '';
                reservations.forEach((reservation, index) => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
                        ${isEditMode ? `<input type="checkbox" class="form-check-input me-2 reservation-checkbox" data-index="${index}">` : ''}
                        ${reservation.time} - ${reservation.patientName} (${reservation.ward}, ${reservation.room})
                        ${isEditMode ? '' : `<button class="btn btn-danger btn-sm delete-reservation" data-index="${index}">삭제</button>`}
                    `;
                    reservationList.appendChild(li);
                });

                // 삭제 버튼에 이벤트 리스너 추가
                document.querySelectorAll('.delete-reservation').forEach(button => {
                    button.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        deleteReservation(index);
                    });
                });
            }

            // 예약 목록에 이벤트 리스너 추가 (이벤트 위임 사용)
            reservationList.addEventListener('click', function(e) {
                if (e.target.classList.contains('delete-reservation')) {
                    const index = parseInt(e.target.getAttribute('data-index'));
                    deleteReservation(index);
                }
            });

            // 예약 확인
            confirmReservationBtn.addEventListener('click', function() {
                const ward = document.getElementById('ward').value;
                const room = document.getElementById('room').value;
                const patientName = document.getElementById('patientName').value;

                if (ward && room && patientName) {
                    // 중복 예약 체크
                    const sameTimeReservations = reservations.filter(r => r.time === selectedDateTime);
                    const sameRoomReservations = sameTimeReservations.filter(r => r.room === room);
                    const sameWardReservations = sameTimeReservations.filter(r => r.ward === ward);

                    if (sameRoomReservations.length > 0) {
                        alert('이미 해당 시간에 같은 호실로 예약이 되어 있습니다.');
                        return;
                    }

                    if (sameWardReservations.length >= 3) {
                        alert('해당 시간에 같은 병동으로 3개 이상 예약할 수 없습니다.');
                        return;
                    }

                    const reservation = {
                        time: selectedDateTime,
                        ward: ward,
                        room: room,
                        patientName: patientName
                    };

                    addReservation(reservation);
                    reservationModal.hide();
                    reservationForm.reset();
                }
            });

            // 예약 내역 다운로드
            downloadReservationsBtn.addEventListener('click', function() {
                const ws = XLSX.utils.json_to_sheet(reservations);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "예약내역");
                XLSX.writeFile(wb, "예약내역.xlsx");
            });

            // 초기화 버튼 클릭 시 초기 상태로 리셋
            resetButton.addEventListener('click', resetToInitialState);

            // 초기 상태로 리셋하는 함수
            function resetToInitialState() {
                if (confirm('모든 데이터를 삭제하고 초기 상태로 돌아갑니다. 계속하시겠습니까?')) {
                    // 로컬 스토리지 데이터 삭제
                    localStorage.removeItem('wardRoomData');
                    localStorage.removeItem('patientData');
                    localStorage.removeItem('reservations');
                    localStorage.removeItem('timeSlotStatus');

                    // 전역 변수 초기화
                    wardRoomData = {};
                    patientData = {};
                    reservations = [];
                    timeSlotStatus = {};

                    // UI 업데이트
                    updateWardSelect();
                    updateReservationList();
                    document.getElementById('wardRoomUpload').value = '';

                    alert('초기 상태로 리셋되었습니다.');
                }
            }

            // 편집 모드 전환
            editReservationsBtn.addEventListener('click', function() {
                isEditMode = !isEditMode;
                document.body.classList.toggle('edit-mode', isEditMode);
                this.textContent = isEditMode ? '편집 완료' : '편집';
                deleteSelectedBtn.classList.toggle('d-none', !isEditMode);
                selectAllContainer.classList.toggle('d-none', !isEditMode);
                updateReservationList();
            });

            // 전체 선택 체크박스 이벤트
            selectAllCheckbox.addEventListener('change', function() {
                const checkboxes = document.querySelectorAll('.reservation-checkbox');
                checkboxes.forEach(checkbox => checkbox.checked = this.checked);
            });

            // 선택된 항목 삭제
            deleteSelectedBtn.addEventListener('click', function() {
                if (confirm('선택된 예약을 모두 삭제하시겠습니까?')) {
                    const checkboxes = document.querySelectorAll('.reservation-checkbox:checked');
                    const indicesToRemove = Array.from(checkboxes).map(checkbox => parseInt(checkbox.getAttribute('data-index'))).sort((a, b) => b - a);
                    indicesToRemove.forEach(index => reservations.splice(index, 1));
                    saveToLocalStorage();
                    updateReservationList();
                }
            });
        });
    </script>
</body>
</html>
