<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새로운 HTML 문서</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="text-danger">안녕하세요! <span id="userName"></span></h1>
        <p>이름을 입력하려면 아래 버튼을 클릭하세요.</p>
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>항목</th>
                    <th>설명</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1행 1열</td>
                    <td>1행 2열</td>
                </tr>
                <tr>
                    <td>2행 1열</td>
                    <td>2행 2열</td>
                </tr>
            </tbody>
        </table>
        <button id="saveButton" class="btn btn-warning mb-4">이름 입력</button>

        <h2 class="mt-4">대한민국 코로나 확산세</h2>
        <script>
            const covidData = [
                { date: '2023-06-01', newCases: 12345, totalCases: 1234567 },
                { date: '2023-06-02', newCases: 11234, totalCases: 1245801 },
                { date: '2023-06-03', newCases: 10987, totalCases: 1256788 },
                { date: '2023-06-04', newCases: 9876, totalCases: 1266664 },
                { date: '2023-06-05', newCases: 8765, totalCases: 1275429 }
            ];
        </script>
        <table class="table table-bordered table-striped mt-3">
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>신규 확진자</th>
                    <th>누적 확진자</th>
                </tr>
            </thead>
            <tbody id="covidTableBody">
            </tbody>
        </table>
        <button id="downloadExcel" class="btn btn-success mb-4">엑셀로 다운로드</button>
        <script>
            const tableBody = document.getElementById('covidTableBody');
            covidData.forEach(data => {
                const row = `
                    <tr>
                        <td>${data.date}</td>
                        <td>${data.newCases.toLocaleString()}</td>
                        <td>${data.totalCases.toLocaleString()}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            function downloadExcel() {
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += "날짜,신규 확진자,누적 확진자\n";
                covidData.forEach(data => {
                    csvContent += `${data.date},${data.newCases},${data.totalCases}\n`;
                });
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "코로나_데이터.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            document.getElementById('downloadExcel').addEventListener('click', downloadExcel);
        </script>

        <canvas id="covidChart" width="400" height="200"></canvas>

        <script>
            function inputName() {
                const name = prompt('이름을 입력하세요:');
                if (name) {
                    document.getElementById('userName').textContent = name;
                }
            }

            document.getElementById('saveButton').addEventListener('click', inputName);

            // 코로나 차트 데이터
            const ctx = document.getElementById('covidChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['2023-06-01', '2023-06-02', '2023-06-03', '2023-06-04', '2023-06-05'],
                    datasets: [{
                        label: '신규 확진자',
                        data: [12345, 11234, 10987, 9876, 8765],
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        </script>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
