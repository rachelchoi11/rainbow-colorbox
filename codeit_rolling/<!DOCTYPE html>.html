<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롤링 페이퍼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .container {
            height: 108rem;
            width: 192rem;
            position: relative;
            background-color: #ffffff;
        }

        .header {
            height: 64px;
            width: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 0;
            margin: 0 35.6rem;
            background-color: white;
        }

        .logo {
            height: 30px;
            width: 10.6rem;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            height: 2.77rem;
            width: 2.78rem;
            background-color: #F3F0FF;
        }

        .create-button {
            border-radius: 0.6rem;
            padding: 8px 16px;
            height: 40px;
            background-color: white;
            border: 1px solid #E5E5E5;
            font-weight: bold;
            color: #1A1A1A;
            cursor: pointer;
        }

        .header-border {
            height: 1px;
            width: 100%;
            background-color: #ececec;
            position: absolute;
            left: 0;
            top: 6.3rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 30px;
            height: max-content;
            width: 120rem;
            position: absolute;
            left: 36rem;
            top: 12.4rem;
        }

        .section {
            border-radius: 16px;
            height: 32.4rem;
            width: 120rem;
            position: relative;
            background-color: #F8F8F8;
        }

        .point-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 5rem;
            padding: 6px 12px;
            height: max-content;
            background-color: #6C3EF9;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .section-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .section-title {
            color: #1A1A1A;
            font-size: 24px;
            font-weight: bold;
            white-space: pre-line;
        }

        .section-description {
            color: #737373;
            font-size: 18px;
        }

        .preview-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 1.2rem;
            padding: 14px 24px;
            width: 28rem;
            position: absolute;
            left: 46.1rem;
            top: 24px;
            background-color: #6C3EF9;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <nav class="nav">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <span>Rolling</span>
                </div>
                <button class="create-button">롤링 페이퍼 만들기</button>
            </nav>
            <div class="header-border"></div>
        </header>

        <main class="main-content">
            <section class="section">
                <div style="position: absolute; left: 6rem; top: 6rem;">
                    <div class="point-badge">Point. 01</div>
                    <div class="section-content">
                        <h2 class="section-title">누구나 손쉽게, 온라인<br>롤링 페이퍼를 만들 수 있어요</h2>
                        <p class="section-description">로그인 없이 자유롭게 만들어요.</p>
                    </div>
                </div>
            </section>

            <section class="section">
                <div style="position: absolute; left: 72rem; top: 6rem;">
                    <div class="point-badge">Point. 02</div>
                    <div class="section-content">
                        <h2 class="section-title">서로에게 이모지로 감정을<br>표현해보세요</h2>
                        <p class="section-description">롤링 페이퍼에 이모지를 추가할 수 있어요.</p>
                    </div>
                </div>
            </section>
        </main>

        <button class="preview-button">구경해보기</button>
    </div>
</body>
</html>
