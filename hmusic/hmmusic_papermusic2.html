<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매용 악보 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sheet-music-item img {
            max-width: 200px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">판매용 악보 관리</h1>
        
        <div id="sheetMusicList" class="mb-4"></div>
        
        <h2 class="mb-3">새 악보 추가</h2>
        <form id="addSheetMusicForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="title" placeholder="제목" required>
            </div>
            <div class="mb-3">
                <textarea class="form-control" id="description" placeholder="설명"></textarea>
            </div>
            <div class="mb-3">
                <input type="number" class="form-control" id="price" placeholder="가격" required>
            </div>
            <div class="mb-3">
                <input type="number" class="form-control" id="discount" placeholder="할인률 (%)" min="0" max="100">
            </div>
            <div class="mb-3">
                <input type="file" class="form-control" id="image" accept="image/*" required>
            </div>
            <div class="mb-3">
                <input type="file" class="form-control" id="pdf" accept=".pdf" required>
            </div>
            <button type="submit" class="btn btn-primary">추가</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let sheetMusicList = [];

        function displaySheetMusic() {
            const listContainer = document.getElementById('sheetMusicList');
            listContainer.innerHTML = '<h2 class="mb-3">악보 목록</h2>';
            sheetMusicList.forEach((sheet, index) => {
                const sheetElement = document.createElement('div');
                sheetElement.className = 'card mb-3';
                const discountedPrice = sheet.price * (1 - sheet.discount / 100);
                sheetElement.innerHTML = `
                    <div class="card-body">
                        <h3 class="card-title">${sheet.title}</h3>
                        <img src="${sheet.image}" alt="${sheet.title}" class="img-fluid mb-2" style="max-width: 200px;">
                        <p class="card-text">${sheet.description}</p>
                        <p class="card-text">가격: ${sheet.price}원 (할인가: ${discountedPrice.toFixed(0)}원)</p>
                        <p class="card-text">할인률: ${sheet.discount}%</p>
                        <a href="${sheet.pdf}" download class="btn btn-primary mb-2">PDF 다운로드</a>
                        <button onclick="editSheetMusic(${index})" class="btn btn-secondary mb-2">수정</button>
                        <button onclick="deleteSheetMusic(${index})" class="btn btn-danger mb-2">삭제</button>
                        <div class="edit-form" id="editForm${index}" style="display: none;">
                            <input type="text" class="form-control mb-2" id="editTitle${index}" value="${sheet.title}">
                            <textarea class="form-control mb-2" id="editDescription${index}">${sheet.description}</textarea>
                            <input type="number" class="form-control mb-2" id="editPrice${index}" value="${sheet.price}">
                            <input type="number" class="form-control mb-2" id="editDiscount${index}" value="${sheet.discount}" min="0" max="100">
                            <button onclick="saveEdit(${index})" class="btn btn-success">저장</button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(sheetElement);
            });
        }

        function addSheetMusic(event) {
            event.preventDefault();
            const newSheet = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                price: Number(document.getElementById('price').value),
                discount: Number(document.getElementById('discount').value),
                image: URL.createObjectURL(document.getElementById('image').files[0]),
                pdf: URL.createObjectURL(document.getElementById('pdf').files[0])
            };
            sheetMusicList.push(newSheet);
            displaySheetMusic();
            event.target.reset();
        }

        function editSheetMusic(index) {
            document.getElementById(`editForm${index}`).style.display = 'block';
        }

        function saveEdit(index) {
            sheetMusicList[index].title = document.getElementById(`editTitle${index}`).value;
            sheetMusicList[index].description = document.getElementById(`editDescription${index}`).value;
            sheetMusicList[index].price = Number(document.getElementById(`editPrice${index}`).value);
            sheetMusicList[index].discount = Number(document.getElementById(`editDiscount${index}`).value);
            displaySheetMusic();
        }

        function deleteSheetMusic(index) {
            if (confirm('이 악보를 삭제하시겠습니까?')) {
                sheetMusicList.splice(index, 1);
                displaySheetMusic();
            }
        }

        document.getElementById('addSheetMusicForm').addEventListener('submit', addSheetMusic);
        displaySheetMusic();
    </script>
</body>
</html>
